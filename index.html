function exampleHTML(q,color){
  if(q.type==='sentence')return `<div class="q-text">Put these words in order:</div>
    <div class="wbank">${shuf(q.words).map(w=>`<span class="wchip used">${esc(w)}</span>`).join('')}</div>
    <div class="ex-ans">✅ ${esc(q.correct)}.</div><div class="ex-why"><b>How:</b> ${q.hint}</div>`;
  if(q.type==='multi')return `<div class="q-text">${esc(q.question)}</div><div class="opts">${q.opts.map((o,i)=>`<div class="opt ${q.answers.includes(o)?'correct':'faded'}"><span class="opt-l">${q.answers.includes(o)?'✓':''}</span>${o}</div>`).join('')}</div><div class="ex-why"><b>Why:</b> ${q.explanation}</div>`;
  if(q.type==='order')return `<div class="q-text">${esc(q.question)}</div><ol class="ex-order">${q.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><div class="ex-why"><b>Why:</b> ${q.explanation}</div>`;
  if(q.type==='race')return `${q.passage?`<div class="passage" style="border-color:${color}">${q.passage}</div>`:''}
    <div class="q-text">${q.question}</div>
    ${['R','A','C','E'].map(l=>`<div class="race-m"><b>${l}:</b> ${q.model[l]}</div>`).join('')}`;
  const dg=q.dgSvg?{svg:q.dgSvg}:diagram(q,color);
  return `${q.passage?`<div class="passage" style="border-color:${color}">${q.passage}</div>`:''}
    <div class="q-text">${String(dg&&dg.text||q.question).replace(/\n/g,'<br>')}</div>
    ${dg?`<div class="dg-wrap">${dg.svg}</div>`:''}
    <div class="opts">${q.opts.map((o,i)=>`<div class="opt ${String(o)===String(q.answer)?'correct':'faded'}"><span class="opt-l">${'ABCD'[i]}</span>${o}</div>`).join('')}</div>
    <div class="ex-why"><b>How to solve it:</b> ${q.explanation||''}</div>`;
}
function drawExample(subj,code){
  const st=findSkill(subj,code);const el=document.getElementById('exArea');if(!st||!el)return;
  el.innerHTML=exampleHTML(makeQ(st.gen),SUBJ[subj].color);
}

// ═══════════════ PRACTICE (SmartScore) ═══════════════
const SESSION={active:false};
function beginPractice(subj,code){
  const st=findSkill(subj,code);if(!st)return renderDash();
  const r=ensureSkill(subj,code);
  Object.assign(SESSION,{mode:'skill',subj,code,gen:st.gen,name:st.name,n:0,c:0,sec:0,start:Date.now(),
    startScore:r.score,run:0,wrongRun:0,recent:[],q:null,answered:false,needReview:false,justMastered:false});
  ST.subject=subj;ST.lastSkill={subj,code};save();
  renderPracticeShell();nextQuestion();
}
function startReview(){
  if(!ST.missed.length)return renderDash();
  Object.assign(SESSION,{mode:'review',subj:ST.missed[0].subj,code:null,name:'Review mistakes',n:0,c:0,sec:0,start:Date.now(),
    fixed:0,queue:ST.missed.map(m=>m.id),run:0,wrongRun:0,recent:[],q:null,answered:false,needReview:false,justMastered:false});
  renderPracticeShell();nextQuestion();
}
function sessColor(){return SESSION.mode==='review'?'#7C3AED':SUBJ[SESSION.subj].color;}
function renderPracticeShell(){
  const col=sessColor();const s=SUBJ[SESSION.subj];
  const dk=SESSION.mode==='review'?'#4C1D95':s.dk;
  const sub=SESSION.mode==='review'?'Fix them to clear the list':`SOL ${SESSION.code} · ${s.label}`;
  setScreen(`<div id="activity" class="screen active">
    <div class="act-top" style="background:${SESSION.mode==='review'?'#7C5CFA':s.band}">
      <button class="tb-back" style="background:rgba(255,255,255,.2);color:#fff" onclick="endSession()" aria-label="Finish">←</button>
      <div style="flex:1;min-width:0"><div class="act-t">${SESSION.mode==='review'?ic('refresh'):subjIc(SESSION.subj||ST.subject)} ${SESSION.name}</div>
      <div class="act-sub">${sub}</div></div>
      <button class="act-finish" onclick="endSession()">Finish</button>
    </div>
    <div class="prac">
      <main class="prac-main" id="actBody" aria-live="polite"></main>
      <aside class="side">
        <div class="side-box"><div class="side-l">Questions</div><div class="side-v" id="sQ">0</div></div>
        <div class="side-box"><div class="side-l">Time</div><div class="side-v" id="sT">00:00</div></div>
        ${SESSION.mode==='review'
          ?`<div class="side-box side-score"><div class="side-l">Left to fix</div><div class="side-v" id="sLeft">${SESSION.queue.length}</div></div>`
          :`<div class="side-box side-score"><div class="side-l">SmartScore</div><div id="sRing">${ring(scoreOf(SESSION.subj,SESSION.code),70,col)}</div><div class="side-lv" id="sLv"></div></div>`}
      </aside>
    </div></div>`);
  SESSION.active=true;
  _tick=setInterval(()=>{const el=document.getElementById('sT');if(el)el.textContent=clock((Date.now()-SESSION.start)/1000);},1000);
  updateSide();
}
function updateSide(){
  const q=document.getElementById('sQ');if(q)q.textContent=SESSION.n;
  if(SESSION.mode==='review'){const l=document.getElementById('sLeft');if(l)l.textContent=SESSION.queue.length;return;}
  const r=getSkill(SESSION.subj,SESSION.code)||{score:0,n:0};
  const rg=document.getElementById('sRing');if(rg)rg.innerHTML=ring(r.score,70,sessColor());
  const lv=document.getElementById('sLv');if(lv){const L=level(r.score,r.n||1);lv.textContent=L.t;lv.className='side-lv '+L.cls;}
}
function nextQuestion(){
  let q;
  if(SESSION.mode==='review'){
    if(!SESSION.queue.length)return endSession();
    const m=ST.missed.find(x=>x.id===SESSION.queue[0]);
    if(!m){SESSION.queue.shift();return nextQuestion();}
    SESSION.subj=m.subj;SESSION.reviewItem=m;q=JSON.parse(JSON.stringify(m.q));
    if(q.opts)q.opts=shuf(q.opts);
  } else {
    for(let i=0;i<15;i++){q=makeQ(SESSION.gen);const sig=(q.passage||'')+q.question+(q.correct||'');
      if(!SESSION.recent.includes(sig)){SESSION.recent.push(sig);if(SESSION.recent.length>10)SESSION.recent.shift();break;}}
  }
  SESSION.q=q;SESSION.answered=false;SESSION.qStart=Date.now();
  const body=document.getElementById('actBody');if(!body)return;
  body.innerHTML='';renderQuestion(q,body);
  if(ST.settings.autoRead&&q.type==='mc')speakQuestion();
}
function qHeader(q,col){
  const tag=SESSION.mode==='review'&&SESSION.reviewItem?`<span class="sol-tag" style="background:${SUBJ[SESSION.reviewItem.subj].color}">${SUBJ[SESSION.reviewItem.subj].short} · SOL ${SESSION.reviewItem.code}</span>`
    :(q.sol?`<span class="sol-tag" style="background:${col}">SOL ${q.sol}</span>`:'');
  return `<div class="q-top"><span class="q-badge" style="background:${col}18;color:${col}">${q.badge||'Question'}</span>${tag}
    ${voiceOK()?`<button class="speak-mini" onclick="speakQuestion()" title="Read the question to me" aria-label="Read the question aloud">🔊</button>`:''}</div>`;
}
function renderQuestion(q,body){
  const col=sessColor();
  const card=document.createElement('div');card.className='qc';
  if(q.type==='sentence'){
    card.innerHTML=`${qHeader(q,col)}<div class="q-text">Put the words in the correct order:</div>
      <div class="sm-label">Word bank — tap to add</div><div class="wbank" id="wbank"></div>
      <div class="sm-label">Your sentence — tap a word to remove it</div><div class="sdrop" id="sdrop"></div>
      <div class="hintbox" id="hintBox">💡 ${q.hint}</div>`;
    body.appendChild(card);
    SESSION.words=shuf(q.words);SESSION.placed=[];drawSentence();
    actionBar(body,`<button class="btn btn-sec" onclick="showHint()">💡 Hint</button><button class="btn btn-pri" style="background:${col}" onclick="checkSentence()">Check ✓</button>`);
    return;
  }
  if(q.type==='race'){
    const rc={R:'#2563EB',A:'#0891B2',C:'#059669',E:'#7C3AED'};
    const rl={R:'Restate the question',A:'Answer it directly',C:'Cite evidence from the text',E:'Explain how it proves your answer'};

  document.querySelectorAll('#opts .opt').forEach(btn=>{btn.disabled=true;const bi=+btn.dataset.i;
    if(String(q.opts[bi])===String(q.answer))btn.classList.add('correct');else if(bi===i)btn.classList.add('wrong');else btn.classList.add('faded');});

function checkMulti(){
  if(SESSION.answered)return;const q=SESSION.q;if(!SESSION.sel.size)return showHint();

  document.querySelectorAll('#opts .opt').forEach(b=>{const i=+b.dataset.i,o=q.opts[i],isA=want.has(o),picked=SESSION.sel.has(i);b.disabled=true;
    if(isA)b.classList.add('correct');else if(picked)b.classList.add('wrong');else b.classList.add('faded');if(isA!==picked)ok=false;});

// core scoring for every answer
function record(correct,answerText,expl){
  if(SESSION.answered)return;SESSION.answered=true;
  const sec=Math.min(120,(Date.now()-SESSION.qStart)/1000);
  SESSION.n++;SESSION.sec+=sec;if(correct)SESSION.c++;
  ST.totalQ++;if(correct)ST.totalC++;
  ST.streak=correct?ST.streak+1:0;ST.bestStreak=Math.max(ST.bestStreak||0,ST.streak);
  const d=dayRec();const before=d.q;d.q++;if(correct)d.c++;d.sec+=sec;
  ST.subjectN[SESSION.subj]=(ST.subjectN[SESSION.subj]||0)+1;
  let delta=0;
  if(SESSION.mode==='skill'){
    const r=ensureSkill(SESSION.subj,SESSION.code);const was=r.score;
    r.n++;if(correct)r.c++;r.sec+=sec;r.last=Date.now();
    r.score=correct?Math.min(100,r.score+smartGain(r.score)):Math.max(0,r.score-smartLoss(r.score));
    delta=r.score-was;r.best=Math.max(r.best,r.score);
    if(r.score>=100&&was<100){r.mastered=Date.now();SESSION.justMastered=true;}
    ST.strandN[SESSION.subj+'_'+SESSION.code]=(ST.strandN[SESSION.subj+'_'+SESSION.code]||0)+1;
    if(!correct&&SESSION.q.type!=='race')rememberMiss(SESSION.q,SESSION.subj,SESSION.code);
  } else {
    const id=SESSION.queue.shift();
    if(correct){ST.missed=ST.missed.filter(m=>m.id!==id);SESSION.fixed++;}
    else SESSION.queue.push(id);
  }
  SESSION.run=correct?SESSION.run+1:0;SESSION.wrongRun=correct?0:SESSION.wrongRun+1;
  if(SESSION.mode==='skill'&&SESSION.wrongRun>=2){SESSION.needReview=true;SESSION.wrongRun=0;}
  if(correct)ST.xp+=5;
  if(correct&&SESSION.run&&SESSION.run%5===0){ST.stars++;}
  // feedback
  const fb=document.getElementById('fbCard');
  const praise=pick(['Correct!','Nice work!','You got it!','Excellent!','Spot on!']);
  if(correct){
    fb.className='fb2 ok';
    fb.innerHTML=`<div class="fb2-h">🎉 ${praise}${delta?` <span class="gain">+${delta}</span>`:''}${SESSION.run>=3?` <span class="fire">🔥 ${SESSION.run} in a row</span>`:''}</div>
      ${expl?`<div class="fb2-b">${expl}</div>`:''}`;
    FX.correct();if(SESSION.run>=3)FX.combo&&FX.combo();
  } else {
    fb.className='fb2 err';
    fb.innerHTML=`<div class="fb2-h">Not quite — let's learn from it${delta?` <span class="loss">${delta}</span>`:''}</div>
      ${answerText!==null&&answerText!==undefined?`<div class="fb2-ans">The correct answer is <b>${answerText}</b></div>`:''}
      ${expl?`<div class="fb2-b"><b>Why:</b> ${expl}</div>`:''}`;
    FX.wrong();
  }
  const label=SESSION.justMastered?'🏅 See your medal →':SESSION.needReview?'Let\'s review together →':correct?'Next question →':'Got it →';
  document.getElementById('actBtns').innerHTML=`<button class="btn btn-pri big" id="nextBtn" style="background:${sessColor()}" onclick="afterAnswer()">${label}</button>`;
  setTimeout(()=>{const b=document.getElementById('nextBtn');if(b)b.focus({preventScroll:true});},30);
  updateSide();
  if(before<ST.dailyGoal&&d.q>=ST.dailyGoal){toast('🎯','Daily goal reached!',`${ST.dailyGoal} questions today`);FX.win();confetti(window.innerWidth/2,120,50);}
  checkAch();save();
}
function rememberMiss(q,subj,code){
  const sig=(q.passage||'')+q.question;
  ST.missed=ST.missed.filter(m=>(m.q.passage||'')+m.q.question!==sig);
  const qc=Object.assign({},q);delete qc._display;ST.missed.push({id:'m'+Date.now().toString(36)+Math.floor(Math.random()*1e4),subj,code,q:qc,at:Date.now()});
  if(ST.missed.length>30)ST.missed=ST.missed.slice(-30);
}

function renderReport(){
  const gc=gradeContent();const now=new Date();
  const days=[];for(let i=13;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);const k=todayKey(d);
    days.push({k,lab:['Su','Mo','Tu','We','Th','Fr','Sa'][d.getDay()],q:(ST.days[k]||{}).q||0,c:(ST.days[k]||{}).c||0,sec:(ST.days[k]||{}).sec||0});}
  const maxQ=Math.max(5,...days.map(d=>d.q));const wk=days.slice(7);
  const wkQ=wk.reduce((a,d)=>a+d.q,0),wkC=wk.reduce((a,d)=>a+d.c,0),wkSec=wk.reduce((a,d)=>a+d.sec,0);
  const totSec=Object.values(ST.skills).reduce((a,s)=>a+(s.sec||0),0);

  const attention=rows.filter(r=>r.n>=8&&r.score<100&&(r.c/r.n<0.65||(r.score<50&&r.n>=12))).sort((a,b)=>a.c/a.n-b.c/b.n);
  const strengths=rows.filter(r=>r.score>=90).sort((a,b)=>b.score-a.score);
  const lastDate=t=>t?new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'}):'—';
  const pill=r=>{const L=level(r.score,r.n);return `<span class="lv ${L.cls}">${L.t}</span>`;};

function startSpeedMathIntro(){intro('⚡','Speed Math','Solve as fast as you can! 3 lives, combo bonuses for streaks. One wrong answer or running out of time costs a life. How high can you score?',speedMathBegin);}
function speedMathBegin(){_g={score:0,lives:3,combo:0,timeLeft:6};renderSpeedMath();}
function makeSpeedQ(){
  const gc=gcNum();const t=rng(0,gc>=6?4:2);let a,b,ans,op;
  if(gc>=6){
    if(t===0){a=rng(2,12);b=rng(2,12);ans=a*b;op='×';}
    else if(t===1){a=rng(20,99);b=rng(10,50);ans=a+b;op='+';}
    else if(t===2){b=rng(2,12);ans=rng(2,12);a=b*ans;return{text:`${a} ÷ ${b}`,ans};}
    else if(t===3){a=rng(-9,9);b=rng(-9,9);ans=a+b;return{text:`(${a}) + (${b})`,ans};}
    else{a=rng(30,120);b=rng(10,a);ans=a-b;op='−';}
  }else{
    if(t===0){a=rng(2,25);b=rng(2,25);ans=a+b;op='+';}
    else if(t===1){a=rng(10,40);b=rng(1,a);ans=a-b;op='−';}
    else{a=rng(2,9);b=rng(2,9);ans=a*b;op='×';}
  }
  return{text:`${a} ${op} ${b}`,ans};
}
function renderSpeedMath(){
  _g.q=makeSpeedQ();_g.timeLeft=Math.max(3,6-Math.floor(_g.score/60));
  let opts=[...new Set([_g.q.ans,_g.q.ans+rng(1,5),_g.q.ans-rng(1,4),_g.q.ans+rng(6,12)])].slice(0,4);
  while(opts.length<4)opts.push(_g.q.ans+rng(13,25));
  opts=shuf(opts);
  gameShell(`
    <div class="game-stat-row">
      <div class="gstat"><div class="gstat-n" id="smScore">${_g.score}</div><div class="gstat-l">Score</div></div>
      <div class="gstat"><div class="gstat-n">${_g.combo}x</div><div class="gstat-l">Combo</div></div>
    </div>
    <div class="lives">${'❤️'.repeat(_g.lives)}${'🖤'.repeat(3-_g.lives)}</div>
    <div class="timer-bar"><div class="timer-fill" id="smTimer" style="width:100%"></div></div>
    <div class="game-card">
      ${_g.combo>=3?`<div class="combo">🔥 ${_g.combo} COMBO!</div>`:'<div class="combo"></div>'}
      <div class="gq">${_g.q.text}</div>
      <div class="g-opts">${opts.map(o=>`<button class="g-opt" onclick="smAnswer(${o},event)">${o}</button>`).join('')}</div>
    </div>`,'⚡','Speed Math');
  startSmTimer();
}
function startSmTimer(){
  clearInterval(_g.timer);const total=_g.timeLeft;let el=0;
  _g.timer=setInterval(()=>{el+=0.1;const pct=Math.max(0,100-el/total*100);
    const tf=document.getElementById('smTimer');if(tf)tf.style.width=pct+'%';
    if(el>=total){clearInterval(_g.timer);smLoseLife();}},100);
}
function smAnswer(v,e){
  clearInterval(_g.timer);const correct=v===_g.q.ans;
  document.querySelectorAll('.g-opt').forEach(b=>{b.disabled=true;
    if(+b.textContent===_g.q.ans)b.classList.add('correct');
    else if(+b.textContent===v&&!correct)b.classList.add('wrong');});
  if(correct){
    FX.correct();_g.combo++;const pts=10+(_g.combo>=3?_g.combo*2:0);_g.score+=pts;
    if(e){const r=e.target.getBoundingClientRect();floatText(r.left+r.width/2,r.top,`+${pts}`,'#10B981');if(_g.combo>=3)FX.combo(_g.combo);}
    setTimeout(renderSpeedMath,420);
  }else{FX.wrong();shake();_g.combo=0;setTimeout(smLoseLife,650);}
}
function smLoseLife(){_g.lives--;_g.combo=0;if(_g.lives<=0)return smGameOver();renderSpeedMath();}
function smGameOver(){
  clearInterval(_g.timer);const prevHi=ST.gameHi.speedmath||0;
  saveHi('speedmath',_g.score);addXP(Math.floor(_g.score/10),Math.floor(_g.score/50));
  gameOverCard('⚡','Game Over',_g.score,_g.score>prevHi?'A brand new record!':'Best: '+Math.max(prevHi,_g.score),speedMathBegin);
}

// ═══════════════════════════════════════════════════════════════
function startAsteroidsIntro(){intro('☄️','Math Asteroids','Solve the problem, then tap the asteroid with the correct answer to blast it! Wrong asteroids cost a life. Speed increases as you score. Defend your ship! 🚀',asteroidsBegin);}
function asteroidsBegin(){
  _g={score:0,lives:3,level:1,asteroids:[],q:null,raf:null,spawnT:0,running:true,particles:[]};
  gameShell(`
    <div class="game-stat-row">
      <div class="gstat"><div class="gstat-n" id="asScore">0</div><div class="gstat-l">Score</div></div>
      <div class="gstat"><div class="gstat-n" id="asLives">❤️❤️❤️</div><div class="gstat-l">Lives</div></div>
    </div>
    <div class="ast-prompt" id="asPrompt">Solve: —</div>
    <canvas id="asCanvas" class="ast-canvas"></canvas>
    <div class="ast-hint">Tap the asteroid with the correct answer!</div>
  `,'☄️','Math Asteroids');
  const cv=document.getElementById('asCanvas');
  const wrap=cv.parentElement;
  cv.width=Math.min(wrap.clientWidth,560); cv.height=380;
  _g.cv=cv; _g.cx=cv.getContext('2d');
  cv.addEventListener('click',asClick);
  cv.addEventListener('touchstart',e=>{e.preventDefault();const r=cv.getBoundingClientRect();const t=e.touches[0];asHit(t.clientX-r.left,t.clientY-r.top);},{passive:false});
  asNewProblem();
  _g.last=performance.now();
  asLoop();
}
function asNewProblem(){
  const gc=gcNum();let a,b,ans,op;const t=rng(0,gc>=6?3:2);
  if(gc>=6){if(t===0){a=rng(3,12);b=rng(3,12);ans=a*b;op='×';}
    else if(t===1){b=rng(2,9);ans=rng(3,12);a=b*ans;op='÷';}
    else if(t===2){a=rng(-9,9);b=rng(-9,9);ans=a+b;op='+';a=`(${a})`;b=`(${b})`;}
    else{a=rng(40,99);b=rng(10,39);ans=a-b;op='−';}}
  else{if(t===0){a=rng(5,30);b=rng(5,30);ans=a+b;op='+';}
    else if(t===1){a=rng(10,40);b=rng(1,a);ans=a-b;op='−';}
    else{a=rng(2,9);b=rng(2,9);ans=a*b;op='×';}}
  _g.q={text:`${a} ${op} ${b}`,ans};
  document.getElementById('asPrompt').textContent=`Solve:  ${_g.q.text}`;
  // spawn 4 asteroids, one correct
  _g.asteroids=[];
  const vals=[...new Set([ans,ans+rng(1,6),ans-rng(1,5),ans+rng(7,14)])].slice(0,4);
  while(vals.length<4)vals.push(ans+rng(15,25));
  const cvw=_g.cv.width, slots=shuf([0,1,2,3]);
  shuf(vals).forEach((v,i)=>{
    _g.asteroids.push({val:v,correct:v===ans,x:60+slots[i]*(cvw-120)/3,y:-rng(10,120)-i*60,
      r:rng(26,32),vy:0.35+_g.level*0.12,rot:Math.random()*6,vr:(Math.random()-0.5)*0.05});
  });
}
function asLoop(){
  if(!_g.running)return;
  const now=performance.now(),dt=Math.min(2,(now-_g.last)/16.67);_g.last=now;
  const cx=_g.cx,cv=_g.cv;
  cx.fillStyle='#0B1120';cx.fillRect(0,0,cv.width,cv.height);
  // stars
  cx.fillStyle='rgba(255,255,255,.4)';
  for(let i=0;i<30;i++){const sx=(i*97+ (now/50))%cv.width, sy=(i*53)%cv.height;cx.fillRect(sx,sy,1.5,1.5);}
  // ship
  cx.save();cx.translate(cv.width/2,cv.height-24);
  cx.fillStyle='#3B82F6';cx.beginPath();cx.moveTo(0,-16);cx.lineTo(13,14);cx.lineTo(0,7);cx.lineTo(-13,14);cx.closePath();cx.fill();
  cx.fillStyle='#93C5FD';cx.beginPath();cx.arc(0,-2,4,0,7);cx.fill();cx.restore();
  // asteroids
  let allGone=true;
  _g.asteroids.forEach(a=>{
    if(a.dead)return; allGone=false;
    a.y+=a.vy*dt;a.rot+=a.vr*dt;
    cx.save();cx.translate(a.x,a.y);cx.rotate(a.rot);
    cx.fillStyle=a.correct?'#7C3AED':'#64748B';
    cx.strokeStyle=a.correct?'#A78BFA':'#94A3B8';cx.lineWidth=2;
    cx.beginPath();
    for(let i=0;i<8;i++){const ang=i/8*Math.PI*2,rr=a.r*(0.82+((i*37)%10)/28);cx.lineTo(Math.cos(ang)*rr,Math.sin(ang)*rr);}
    cx.closePath();cx.fill();cx.stroke();cx.restore();
    // value
    cx.fillStyle='#fff';cx.font='bold 17px Nunito, sans-serif';cx.textAlign='center';cx.textBaseline='middle';
    cx.fillText(a.val,a.x,a.y);
    // reached bottom
    if(a.y>cv.height-30){a.dead=true;if(a.correct){asMiss();}}
  });
  // particles
  _g.particles=_g.particles.filter(p=>{p.life--;p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;
    cx.globalAlpha=Math.max(0,p.life/24);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.s,0,7);cx.fill();cx.globalAlpha=1;
    return p.life>0;});
  if(allGone && _g.running){asNewProblem();}
  _g.raf=requestAnimationFrame(asLoop);
}
function asClick(e){const r=_g.cv.getBoundingClientRect();asHit(e.clientX-r.left,e.clientY-r.top);}
function asHit(mx,my){
  if(!_g.running)return;
  for(const a of _g.asteroids){
    if(a.dead)continue;
    if(Math.hypot(mx-a.x,my-a.y)<a.r+6){
      if(a.correct){
        FX.laser();setTimeout(()=>FX.explosion(),80);
        a.dead=true;_g.score+=10+_g.level;_g.level=1+Math.floor(_g.score/50);
        document.getElementById('asScore').textContent=_g.score;
        for(let i=0;i<16;i++)_g.particles.push({x:a.x,y:a.y,vx:(Math.random()-0.5)*7,vy:(Math.random()-0.5)*7,life:24,s:rng(2,5),c:pick(['#A78BFA','#F59E0B','#fff','#EC4899'])});
        // kill others
        _g.asteroids.forEach(o=>{if(!o.correct)o.dead=true;});
      }else{
        FX.wrong();shake(8);a.dead=true;asMiss();
        for(let i=0;i<10;i++)_g.particles.push({x:a.x,y:a.y,vx:(Math.random()-0.5)*5,vy:(Math.random()-0.5)*5,life:20,s:rng(2,4),c:'#EF4444'});
      }
      return;
    }
  }
}
function asMiss(){
  _g.lives--;const le=document.getElementById('asLives');
  if(le)le.textContent='❤️'.repeat(Math.max(0,_g.lives))+'🖤'.repeat(3-_g.lives);
  flash('#EF4444');
  if(_g.lives<=0){asGameOver();return;}
  // reset problem after brief pause
  _g.asteroids.forEach(a=>a.dead=true);
  setTimeout(()=>{if(_g.running)asNewProblem();},400);
}
function asGameOver(){
  _g.running=false;cancelAnimationFrame(_g.raf);
  const prevHi=ST.gameHi.asteroids||0;saveHi('asteroids',_g.score);
  addXP(Math.floor(_g.score/8),Math.floor(_g.score/40));

}

function startNinjaIntro(){intro('🥷','Number Ninja','A problem appears — slice the flying answers that are CORRECT, and DODGE the bombs 💣! Correct slices build combos. Slicing a bomb or missing too many correct answers ends the run. Ready, ninja?',ninjaBegin);}
function ninjaBegin(){
  _g={score:0,lives:3,combo:0,objects:[],q:null,raf:null,spawnT:0,running:true,slices:[],misses:0};
  gameShell(`
    <div class="game-stat-row">
      <div class="gstat"><div class="gstat-n" id="njScore">0</div><div class="gstat-l">Score</div></div>
      <div class="gstat"><div class="gstat-n" id="njLives">❤️❤️❤️</div><div class="gstat-l">Lives</div></div>
    </div>
    <div class="ast-prompt" id="njPrompt">—</div>
    <canvas id="njCanvas" class="ast-canvas" style="background:linear-gradient(180deg,#1E1B4B,#0B1120)"></canvas>
    <div class="ast-hint">Swipe/tap the CORRECT answers · avoid 💣</div>
  `,'🥷','Number Ninja');
  const cv=document.getElementById('njCanvas');const wrap=cv.parentElement;
  cv.width=Math.min(wrap.clientWidth,560);cv.height=380;
  _g.cv=cv;_g.cx=cv.getContext('2d');
  const hit=(x,y)=>njHit(x,y);
  cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect();hit(e.clientX-r.left,e.clientY-r.top);});
  cv.addEventListener('touchmove',e=>{e.preventDefault();const r=cv.getBoundingClientRect();for(const t of e.touches)hit(t.clientX-r.left,t.clientY-r.top);},{passive:false});
  njNewProblem();_g.last=performance.now();njLoop();
}
function njNewProblem(){
  const gc=gcNum();let a,b,ans,op;const t=rng(0,2);
  if(gc>=6){if(t===0){a=rng(3,12);b=rng(3,12);ans=a*b;op='×';}
    else if(t===1){b=rng(2,9);ans=rng(3,12);a=b*ans;op='÷';}
    else{a=rng(40,99);b=rng(10,39);ans=a-b;op='−';}}
  else{if(t===0){a=rng(5,30);b=rng(5,30);ans=a+b;op='+';}
    else if(t===1){a=rng(10,40);b=rng(1,a);ans=a-b;op='−';}
    else{a=rng(2,9);b=rng(2,9);ans=a*b;op='×';}}
  _g.q={text:`${a} ${op} ${b}`,ans};
  const pr=document.getElementById('njPrompt');if(pr)pr.textContent=`${_g.q.text} = ?`;
}
function njSpawn(){
  const cv=_g.cv;const isBomb=Math.random()<0.28;
  const correct=!isBomb && Math.random()<0.55;
  let val;
  if(isBomb)val='💣';
  else if(correct)val=_g.q.ans;
  else{do{val=_g.q.ans+rng(-8,8);}while(val===_g.q.ans);}
  const x=rng(50,cv.width-50);
  _g.objects.push({val,bomb:isBomb,correct,x,y:cv.height+30,
    vx:(cv.width/2-x)/90+(Math.random()-0.5)*1.5,vy:-(rng(80,105)/10),r:26,sliced:false,rot:0,vr:(Math.random()-0.5)*0.1});
}
function njLoop(){
  if(!_g.running)return;
  const now=performance.now(),dt=Math.min(2,(now-_g.last)/16.67);_g.last=now;
  const cx=_g.cx,cv=_g.cv;
  cx.clearRect(0,0,cv.width,cv.height);
  cx.fillStyle='rgba(255,255,255,.25)';
  for(let i=0;i<24;i++){const sx=(i*83)%cv.width,sy=(i*61+now/60)%cv.height;cx.fillRect(sx,sy,1.5,1.5);}
  _g.spawnT-=dt;
  if(_g.spawnT<=0){njSpawn();_g.spawnT=rng(38,66);}
  _g.objects=_g.objects.filter(o=>{
    if(o.sliced){o.sliceLife--;return o.sliceLife>0;}
    o.x+=o.vx*dt;o.y+=o.vy*dt;o.vy+=0.14*dt;o.rot+=o.vr*dt;
    cx.save();cx.translate(o.x,o.y);cx.rotate(o.rot);
    if(o.bomb){cx.font='34px serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('💣',0,0);}
    else{cx.beginPath();cx.arc(0,0,o.r,0,7);
      cx.fillStyle=o.correct?'#10B981':'#F59E0B';cx.fill();
      cx.strokeStyle=o.correct?'#6EE7B7':'#FCD34D';cx.lineWidth=3;cx.stroke();
      cx.fillStyle='#fff';cx.font='bold 18px Nunito, sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(o.val,0,0);}
    cx.restore();
    // fell off bottom
    if(o.y>cv.height+40){if(o.correct&&!o.sliced){njMissCorrect();}return false;}
    return true;
  });
  // slice trails
  _g.slices=_g.slices.filter(s=>{s.life--;cx.globalAlpha=s.life/10;cx.fillStyle='#fff';cx.beginPath();cx.arc(s.x,s.y,4,0,7);cx.fill();cx.globalAlpha=1;return s.life>0;});
  _g.raf=requestAnimationFrame(njLoop);
}
function njHit(mx,my){
  if(!_g.running)return;
  _g.slices.push({x:mx,y:my,life:10});
  for(const o of _g.objects){
    if(o.sliced)continue;
    if(Math.hypot(mx-o.x,my-o.y)<o.r+8){
      if(o.bomb){FX.explosion();shake(9);flash('#EF4444');o.sliced=true;o.sliceLife=1;njLoseLife();return;}
      if(o.correct){FX.slice();o.sliced=true;o.sliceLife=12;_g.combo++;
        const pts=10+(_g.combo>=3?_g.combo*2:0);_g.score+=pts;
        document.getElementById('njScore').textContent=_g.score;
        floatText(_g.cv.getBoundingClientRect().left+o.x,_g.cv.getBoundingClientRect().top+o.y,`+${pts}`,'#10B981');
        if(_g.combo>=3)FX.combo(_g.combo);
      }else{FX.wrong();o.sliced=true;o.sliceLife=1;_g.combo=0;njLoseLife();}
      return;
    }
  }
}
function njMissCorrect(){_g.misses++;if(_g.misses>=3){/* soft penalty */_g.misses=0;njLoseLife();}}
function njLoseLife(){
  _g.lives--;_g.combo=0;const le=document.getElementById('njLives');
  if(le)le.textContent='❤️'.repeat(Math.max(0,_g.lives))+'🖤'.repeat(3-_g.lives);
  if(_g.lives<=0)njGameOver();
}
function njGameOver(){
  _g.running=false;cancelAnimationFrame(_g.raf);
  const prevHi=ST.gameHi.ninja||0;saveHi('ninja',_g.score);
  addXP(Math.floor(_g.score/8),Math.floor(_g.score/40));
  gameOverCard('🥷','Run Over',_g.score,_g.score>prevHi?'A legendary run!':'Best: '+Math.max(prevHi,_g.score),ninjaBegin);
}

function cbLabel(c){return c==='forward'?'▶ Fwd':c==='left'?'↰ Left':c==='right'?'↱ Right':c.startsWith('loop')?`🔁 ×${c.split(':')[1]}`:c;}
function cbFlatten(seq){
  // expand loops into a flat command list. loop:N:cmd,cmd,...  (we store loops as objects)
  const out=[];
  seq.forEach(item=>{
    if(typeof item==='string')out.push(item);
    else if(item.loop){for(let i=0;i<item.n;i++)out.push(...item.cmds);}
  });
  return out;
}
function cbCount(){return _g.seq.reduce((a,it)=>a+(typeof it==='string'?1:it.n*it.cmds.length),0);}
function cbAdd(c){if(_g.running)return;FX.click();_g.seq.push(c);cbSeqDraw();}
function cbAddLoop(){
  if(_g.running)return;
  // take the last up-to-3 simple commands and wrap them
  const simple=[];let i=_g.seq.length-1;
  while(i>=0&&typeof _g.seq[i]==='string'&&simple.length<3){simple.unshift(_g.seq[i]);i--;}
  if(!simple.length){cbMsg('Add 1–3 commands first, then wrap them in a Repeat!','run');return;}
  const n=prompt('Repeat how many times? (2–6)','3');
  const times=Math.max(2,Math.min(6,parseInt(n)||3));
  _g.seq.splice(i+1);
  _g.seq.push({loop:true,n:times,cmds:simple});
  FX.powerup();cbSeqDraw();
}
function cbSeqDraw(){
  const list=document.getElementById('cbSeq');if(!list)return;list.innerHTML='';

  _g.seq.forEach((it,idx)=>{
    if(typeof it==='string'){
      const s=document.createElement('span');s.className='seq-i';s.textContent=cbLabel(it);
      s.onclick=()=>{if(!_g.running){_g.seq.splice(idx,1);cbSeqDraw();}};list.appendChild(s);
    }else{
      const wrap=document.createElement('span');wrap.className='seq-loop';
      wrap.innerHTML=`<span class="seq-loop-h">🔁 ×${it.n}</span>`+it.cmds.map(c=>`<span class="seq-i seq-i-in">${cbLabel(c)}</span>`).join('');

    }
  });
}

}
async function cbRun(){
  if(_g.running)return;

    }else if(cmd==='left'){_g.robot.dir=dirs[(dirs.indexOf(_g.robot.dir)+3)%4];FX.tick();}
    else if(cmd==='right'){_g.robot.dir=dirs[(dirs.indexOf(_g.robot.dir)+1)%4];FX.tick();}

    const gem=_g.level.gems.find(g=>g.x===_g.robot.x&&g.y===_g.robot.y&&!_g.collected.some(c=>c.x===g.x&&c.y===g.y));

  }
  const atGoal=_g.robot.x===_g.level.goal.x&&_g.robot.y===_g.level.goal.y;
  const allGems=_g.level.gems.length===_g.collected.length;
  _g.running=false;const rb2=document.getElementById('cbRun');if(rb2)rb2.disabled=false;
  if(atGoal&&allGems){
    const used=cbFlatten(_g.seq).length;
    const stars=used<=_g.level.par?3:used<=_g.level.par*1.4?2:1;
    if(_g.idx+1>(ST.gameHi.codebot||0))ST.gameHi.codebot=_g.idx+1;
    if(stars>(ST.gameHi['codebot_stars_'+_g.idx]||0))ST.gameHi['codebot_stars_'+_g.idx]=stars;
    addXP(15+stars*5,stars);checkAch();save();
    FX.win();const gr=document.getElementById('cbGrid').getBoundingClientRect();confetti(gr.left+gr.width/2,gr.top+gr.height/2,50);
    setTimeout(()=>{
      const nextExists=_g.idx+1<CB_LEVELS.length;
      gameShell(`<div class="game-over">
        <div class="go-emoji">🏆</div><div class="go-t">Level ${_g.idx+1} Complete!</div>
        <div class="res-stars" style="font-size:2.4rem">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
        <div class="xp-pop">+${15+stars*5} XP</div>

        ${nextExists?`<button class="game-play-btn" id="cbNext">▶ Next Level</button>`:`<div style="color:#FCD34D;font-family:'Fredoka',cursive;font-size:1.3rem;margin:16px 0">🎉 You beat every level!</div>`}

      </div>`,'🤖','CodeBot Quest');
      const nb=document.getElementById('cbNext');if(nb)nb.onclick=()=>{FX.powerup();cbStart(_g.idx+1);};
    },950);
  }else if(atGoal&&!allGems){
    FX.wrong();cbMsg(`🤔 You reached the goal but missed ${_g.level.gems.length-_g.collected.length} gem(s)! Collect them all first.`,'lose');
  }else{
    FX.lose();cbMsg('🤔 Not at the goal yet. Adjust your program and try again!','lose');
  }
}

// 5. FRACTION MATCH (polished)
// ═══════════════════════════════════════════════════════════════
const FRAC_PAIRS=[['1/2','2/4'],['1/3','2/6'],['1/4','2/8'],['3/4','6/8'],['2/3','4/6'],['1/5','2/10'],['3/5','6/10'],['1/2','3/6']];
function startFracMatchIntro(){intro('🍕','Fraction Match','Flip cards to find matching equivalent fractions! ½ matches 2/4, ⅓ matches 2/6, and so on. Match all 6 pairs in as few moves as possible!',fracMatchBegin);}
function fracMatchBegin(){
  const pairs=shuf(FRAC_PAIRS).slice(0,6);let cards=[];
  pairs.forEach((p,i)=>{cards.push({v:p[0],id:i},{v:p[1],id:i});});
  _g={cards:shuf(cards),flipped:[],matched:[],moves:0,done:0};renderFracMatch();
}
function renderFracMatch(){
  gameShell(`
    <div class="game-stat-row">
      <div class="gstat"><div class="gstat-n">${_g.moves}</div><div class="gstat-l">Moves</div></div>
      <div class="gstat"><div class="gstat-n">${_g.done}/6</div><div class="gstat-l">Pairs</div></div>
    </div>
    <div class="game-card">
      <div style="text-align:center;color:var(--neutral);font-size:.85rem;margin-bottom:10px">Match equivalent fractions!</div>
      <div class="match-grid">
        ${_g.cards.map((c,i)=>{const f=_g.flipped.includes(i),m=_g.matched.includes(i);
          return `<div class="mcard${f?' flipped':''}${m?' matched':''}" onclick="fmFlip(${i})">${f||m?c.v:'?'}</div>`;}).join('')}
      </div>
    </div>`,'🍕','Fraction Match');
}
function fmFlip(i){
  if(_g.flipped.includes(i)||_g.matched.includes(i)||_g.flipped.length>=2)return;
  FX.click();_g.flipped.push(i);renderFracMatch();
  if(_g.flipped.length===2){_g.moves++;const [a,b]=_g.flipped;
    if(_g.cards[a].id===_g.cards[b].id){
      _g.matched.push(a,b);_g.done++;_g.flipped=[];FX.coin();
      setTimeout(()=>{renderFracMatch();if(_g.done===6)fmWin();},380);
    }else{FX.wrong();setTimeout(()=>{_g.flipped=[];renderFracMatch();},850);}
  }
}
function fmWin(){
  const score=Math.max(100,300-_g.moves*15);const prevHi=ST.gameHi.fracmatch||0;
  saveHi('fracmatch',score);addXP(20,3);
  gameOverCard('🍕','Complete!',score,`Solved in ${_g.moves} moves!`,fracMatchBegin);
}

function startWordWizIntro(){intro('🔤','Word Wizard','Pick the correct synonym before the timer runs out! Correct answers add points and speed. Three misses ends the game. Grow your vocabulary!',wordWizBegin);}
function wordWizBegin(){_g={score:0,wrong:0,bank:shuf(WORD_BANK[gcNum()]),idx:0};renderWordWiz();}
function renderWordWiz(){
  if(_g.idx>=_g.bank.length){_g.bank=shuf(WORD_BANK[gcNum()]);_g.idx=0;}
  const q=_g.bank[_g.idx];_g.q=q;
  gameShell(`

      <div class="gstat"><div class="gstat-n">${_g.score}</div><div class="gstat-l">Score</div></div>

function wwTimer(){clearInterval(_g.timer);let el=0;const total=10;

    if(el>=total){clearInterval(_g.timer);wwWrong();}},100);}
function wwAnswer(o,e){
  clearInterval(_g.timer);const correct=o===_g.q.syn;
  document.querySelectorAll('.ww-opt').forEach(b=>{b.disabled=true;
    if(b.textContent===_g.q.syn)b.classList.add('correct');
    else if(b.textContent===o&&!correct)b.classList.add('wrong');});
  if(correct){FX.correct();_g.score+=15;_g.idx++;
    if(e){const r=e.target.getBoundingClientRect();floatText(r.left+r.width/2,r.top,'+15','#10B981');}
    setTimeout(renderWordWiz,480);}
  else{FX.wrong();shake();setTimeout(wwWrong,650);}
}
function wwWrong(){_g.wrong++;if(_g.wrong>=3)return wwOver();_g.idx++;renderWordWiz();}
function wwOver(){const prevHi=ST.gameHi.wordwiz||0;saveHi('wordwiz',_g.score);
  addXP(Math.floor(_g.score/10),Math.floor(_g.score/45));

function startSolQuizIntro(){intro('⚔️','SOL Quiz Battle','Battle the boss with your brain! Answer questions from EVERY subject. Each correct answer damages the boss; wrong answers let it strike back. Chain correct answers for extra-damage combos. Defeat the boss!',solQuizBegin);}
function solQuizBegin(){
  const gc=gcNum();const allGens=[];
  ['math','read','sci','write'].forEach(s=>(STRANDS[gc][s]||[]).forEach(st=>allGens.push(st.gen)));
  _g={playerHP:100,bossHP:100,gens:shuf(allGens),idx:0,score:0,streak:0};renderSolQuiz();
}
function renderSolQuiz(){
  if(_g.idx>=_g.gens.length){_g.gens=shuf(_g.gens);_g.idx=0;}
  let q=makeQ(_g.gens[_g.idx]),guard=0;
  while(q.type!=='mc'&&guard<12){_g.idx++;if(_g.idx>=_g.gens.length)_g.idx=0;q=makeQ(_g.gens[_g.idx]);guard++;}
  _g.q=q;
  gameShell(`
    <div style="display:flex;justify-content:space-between;gap:12px;margin-bottom:12px">
      <div style="flex:1"><div style="color:#fff;font-size:.72rem;font-weight:800;margin-bottom:4px">🦸 YOU</div>
        <div class="hp-bar"><div class="hp-fill" style="width:${_g.playerHP}%;background:linear-gradient(90deg,#10B981,#34D399)"></div></div></div>
      <div style="flex:1"><div style="color:#fff;font-size:.72rem;font-weight:800;margin-bottom:4px;text-align:right">👹 BOSS</div>
        <div class="hp-bar"><div class="hp-fill" style="width:${_g.bossHP}%;background:linear-gradient(90deg,#EF4444,#F87171);margin-left:auto"></div></div></div>
    </div>
    <div id="bossFace" style="text-align:center;font-size:3.6rem;margin-bottom:6px">${_g.bossHP>60?'😈':_g.bossHP>30?'😰':'😵'}</div>
    <div class="game-card">
      <div style="display:flex;gap:6px;margin-bottom:10px;align-items:center;flex-wrap:wrap">
        <span class="q-badge" style="background:var(--game-lt);color:var(--game)">${q.badge}</span>
        ${q.sol?`<span class="sol-tag" style="background:var(--game)">SOL ${q.sol}</span>`:''}
        ${_g.streak>=2?`<span style="margin-left:auto;color:var(--game);font-weight:800;font-size:.82rem">🔥 ${_g.streak} combo</span>`:''}
      </div>
      ${q.passage?`<div class="passage" style="border-color:var(--game);font-size:.9rem">${q.passage}</div>`:''}
      <div class="q-text" style="font-size:1rem">${String(q.question).replace(/\n/g,'<br>')}</div>
      <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}" onclick="sqAnswer(${i})"><span class="opt-l">${'ABCD'[i]}</span>${o}</button>`).join('')}</div>
    </div>`,'⚔️','SOL Quiz Battle');
}
function sqAnswer(i){
  const q=_g.q;const correct=String(q.opts[i])===String(q.answer);
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const bi=+b.dataset.i;
    if(String(q.opts[bi])===String(q.answer))b.classList.add('correct');
    else if(bi===i&&!correct)b.classList.add('wrong');});
  if(correct){FX.correct();_g.streak++;const dmg=15+(_g.streak>=3?10:0);_g.bossHP=Math.max(0,_g.bossHP-dmg);_g.score+=dmg;
    const bf=document.getElementById('bossFace');if(bf){bf.style.transform='scale(1.2)';setTimeout(()=>bf.style.transform='',200);}
    if(_g.streak>=3)FX.combo(_g.streak);
    if(_g.bossHP<=0)return setTimeout(sqWin,500);}
  else{FX.wrong();shake(7);flash('#EF4444');_g.streak=0;_g.playerHP=Math.max(0,_g.playerHP-20);
    if(_g.playerHP<=0)return setTimeout(sqLose,700);}
  _g.idx++;setTimeout(renderSolQuiz,correct?550:800);
}
function sqWin(){const prevHi=ST.gameHi.solquiz||0;saveHi('solquiz',_g.score);addXP(30,4);
  gameOverCard('⚔️','Boss Defeated!',_g.score,`Won with ${_g.playerHP}% health left!`,solQuizBegin,'⚔️ Battle Again');}
function sqLose(){saveHi('solquiz',_g.score);addXP(Math.floor(_g.score/10),1);
  gameOverCard('💪','Defeated',_g.score,`Boss had ${_g.bossHP}% left. Try again!`,solQuizBegin,'⚔️ Try Again');}

const NUMW=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];

function spokenTokens(text){

    const m=t.match(/^(\d+)(?::\d+)?/);if(m&&+m[1]<1000){numWords(m[1]).forEach(x=>out.push(x));return;}
    const n=normW(t);if(n)out.push(n);});

}
const SOUNDS_LIKE={two:['to','too'],to:['two','too'],too:['to','two'],four:['for','fore'],for:['four'],one:['won'],won:['one'],eight:['ate'],
  know:['no'],no:['know'],hole:['whole'],whole:['hole'],sun:['son'],son:['sun'],tail:['tale'],sea:['see','c'],see:['sea'],so:['sew'],
  there:['their',"they're"],their:['there'],hear:['here'],here:['hear'],by:['buy','bye'],red:['read'],read:['red','reed'],new:['knew'],knew:['new'],
  right:['write'],sees:['seas','seize'],whirred:['word','whirled','worried'],pats:["pat's",'paths'],pup:['pop','pub','pope'],ama:['amma','alma'],
  mia:['maya','mya'],sam:['psalm','some'],pip:['pep','pick','pit'],biscuit:['biscuits'],ntikuma:[],flippers:['flipper']};
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;
  let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
function wordMatch(exp,said){
  if(!said)return false;if(exp===said)return true;
  const a=exp.replace(/'/g,''),b=said.replace(/'/g,'');if(a===b)return true;
  if(a.length>=4&&a.replace(/s$/,'')===b.replace(/s$/,''))return true;
  if((SOUNDS_LIKE[exp]||[]).includes(said))return true;
  const tol=a.length>=8?2:a.length>=4?1:0;return tol>0&&lev(a,b)<=tol;
}
const STOP=new Set(['the','a','an','and','to','of','in','on','is','it','he','she','i','was','his','her','at','up','so','but','for','with','we','they','you','that','this','as','be','are','had','has']);
// Line up what was said with the words on the page. Greedy: each spoken word
// matches the next page word, or one a few words ahead (the reader skipped).
function alignWords(exp,spoken,start,prev){
  const n=exp.length;const st=prev.slice();for(let j=start;j<n;j++)st[j]=0;let e=start;
  const passFree=()=>{while(e<n&&exp[e].free){st[e]=1;e++;}};
  passFree();
  for(const s of spoken){
    if(e>=n)break;let hit=-1;
    for(let k=0;k<4&&e+k<n;k++){
      const x=exp[e+k];if(k>0&&(x.w.length<3||STOP.has(x.w)))continue;
      if(wordMatch(x.w,s)){hit=e+k;break;}
    }
    if(hit<0)continue;
    for(let j=e;j<hit;j++)st[j]=exp[j].free?1:2;
    st[hit]=1;e=hit+1;passFree();

  document.getElementById('rScene').innerHTML=scene(p.art,p.alt);
  document.getElementById('rPageNo').textContent=`Page ${READ.page+1} of ${b.pages.length} · ${BOOK_LEVELS[b.level].label}`;
  const names=new Set((b.names||[]).map(normW));const gl=b.words||{};
  const toks=[];const exp=[];let html='';
  p.t.forEach((sent,si)=>{html+='<span class="sent">';sent.split(/\s+/).forEach(word=>{
      const k=toks.length;const subs=word.split(/[-–—]+/).map(normW).filter(Boolean);
      const free=!subs.length||subs.every(s=>names.has(s));const key=normW(word.replace(/[’']s$/,''));
      toks.push({text:word,subs,free,si,gloss:gl[key]?key:null});
      subs.forEach(s=>exp.push({w:s,tok:k,free:names.has(s)}));if(!subs.length)exp.push({w:'',tok:k,free:true});
      html+=`<button class="w${gl[key]?' gl':''}" data-k="${k}" onclick="tapWord(${k})">${esc(word)}</button> `;});html+='</span> ';});
  document.getElementById('rText').innerHTML=html;
  Object.assign(READ,{toks,exp,status:new Array(exp.length).fill(0),cur:0,forced:0,forcedSpoken:0,base:READ.heard.length,
    drop:READ.partial?1:0,partial:'',lastProgress:Date.now(),stuckAt:0,helpedAt:0,pageDone:false,pageWordsCounted:false,pageT0:0,pageHelped:0});
  const r0=alignWords(exp,[],0,READ.status);READ.status=r0.st;READ.cur=r0.cur;READ.forced=r0.cur;
  document.getElementById('rDef').hidden=true;
  document.getElementById('prevBtn').disabled=READ.page===0;
  paintWords();
}
function heardChanged(){
  if(!READ.exp||READ.pageDone||!READ.want)return;
  const said=spokenTokens(READ.heard.slice(READ.base).join(' ')+' '+READ.partial);
  const res=alignWords(READ.exp,said.slice(READ.forcedSpoken),READ.forced,READ.status);
  if(res.cur>READ.cur){if(!READ.pageT0)READ.pageT0=Date.now();READ.lastProgress=Date.now();READ.stuckAt=0;READ.helpedAt=0;clearStuck();
    if(Math.random()<.18&&res.cur<READ.exp.length)sparkySays(pick(['Nice!','You’re doing great!','Keep going!','Great reading!','Wow, smooth reading!']),'happy');}
  READ.status=res.st;READ.cur=res.cur;paintWords();
  if(READ.cur>=READ.exp.length)pageComplete(true);
}
function tokState(k){const idx=READ.exp.map((e,i)=>e.tok===k?i:-1).filter(i=>i>=0);const s=idx.map(i=>READ.status[i]);
  if(s.every(x=>x===1))return 'done';if(s.every(x=>x>0))return 'skip';return '';}
function paintWords(){
  const nextTok=READ.cur<READ.exp.length?READ.exp[READ.cur].tok:-1;
  let lastReal=-1;READ.toks.forEach((t,k)=>{if(!t.free&&tokState(k)!=='')lastReal=k;});
  document.querySelectorAll('#rText .w').forEach(el=>{const k=+el.dataset.k;let s=tokState(k);
    if(READ.toks[k].free&&k>lastReal&&!READ.pageDone)s='';
    el.classList.toggle('done',s==='done');el.classList.toggle('skip',s==='skip');el.classList.toggle('next',READ.want&&k===nextTok);});
}
function clearStuck(){document.querySelectorAll('.w.stuck').forEach(x=>x.classList.remove('stuck'));}
function readerTick(){
  if(!READ.want||READ.pageDone||!READ.exp)return;
  const idle=Date.now()-READ.lastProgress;const k=READ.exp[READ.cur]&&READ.exp[READ.cur].tok;if(k===undefined)return;
  const el=document.querySelector(`.w[data-k="${k}"]`);
  if(idle>7000&&!READ.stuckAt){READ.stuckAt=Date.now();if(el)el.classList.add('stuck');
    sparkySays(READ.cur===0?'Start whenever you’re ready! Tap the glowing word if you want help.':'Try sounding it out, one part at a time. Tap the glowing word and I’ll help.','think');}
  else if(READ.stuckAt&&!READ.helpedAt&&Date.now()-READ.stuckAt>7000){helpWord(k);}
  else if(READ.helpedAt&&Date.now()-READ.helpedAt>6000){forcePast(k);}
}
function helpWord(k){
  const t=READ.toks[k];READ.helpedAt=Date.now();
  const w=t.subs.join(' ')||t.text;narrOrSay(READ.book.id,'w:'+normW(t.text),plain(t.text).replace(/[“”"]/g,''),.75);
  READ.pageHelped=(READ.pageHelped||0)+1;
  if(!t.free&&!READ.helpedWords.includes(w)){READ.helpedWords.push(w);const r=rstate();r.tricky[w]=(r.tricky[w]||0)+1;save();}
  sparkySays(`That word is “${t.text.replace(/[“”".,!?;:]/g,'')}”. Now you say it!`,'happy');
}
function forcePast(k){
  // the listener didn't catch it after help: move on so reading keeps flowing
  const said=spokenTokens(READ.heard.slice(READ.base).join(' ')+' '+READ.partial);
  READ.exp.forEach((e,i)=>{if(e.tok===k)READ.status[i]=1;});
  let last=-1;READ.exp.forEach((e,i)=>{if(e.tok===k)last=i;});
  READ.forced=last+1;READ.forcedSpoken=said.length;READ.cur=READ.forced;
  READ.lastProgress=Date.now();READ.stuckAt=0;READ.helpedAt=0;clearStuck();paintWords();
  if(READ.cur>=READ.exp.length)pageComplete(true);else sparkySays('Let’s keep going!','happy');
}
function tapWord(k){
  const t=READ.toks[k];if(!t)return;
  if(READ.want&&!t.free&&READ.exp[READ.cur]&&READ.exp[READ.cur].tok===k){helpWord(k);}
  else narrOrSay(READ.book.id,'w:'+normW(t.text),t.text.replace(/[“”"]/g,''),.75);
  const box=document.getElementById('rDef');
  if(t.gloss){box.hidden=false;box.innerHTML=`<b>${esc(t.gloss)}</b> means ${esc(READ.book.words[t.gloss])}. <button class="speak-mini" data-w="${esc(t.gloss+' means '+READ.book.words[t.gloss])}" onclick="narrOrSay(READ.book.id,'g:${t.gloss}',this.dataset.w,.85)" aria-label="Read the meaning">🔊</button>`;}
  else box.hidden=true;
}
function pageComplete(byVoice){
  if(READ.pageDone)return;READ.pageDone=true;clearStuck();
  if(byVoice&&!READ.pageWordsCounted){READ.pageWordsCounted=true;READ.pagesHeard++;
    const n=READ.toks.filter((t,k)=>!t.free&&tokState(k)==='done').length;READ.wordsRead+=n;const r=rstate();r.words+=n;addXP(2,0);
    const sec=READ.pageT0?(Date.now()-READ.pageT0)/1000:0;if(sec>=2){READ.fluW+=Math.max(0,n-READ.pageHelped);READ.fluS+=sec;}}
  FX.correct();
  const last=READ.page>=READ.book.pages.length-1;
  sparkySays(last?'You read the whole story! 🎉':pick(['Great reading! ⭐','You did it! On to the next page.','Wonderful! Turning the page…']),'cheer');
  document.querySelectorAll('#rText .w').forEach(el=>el.classList.add('done'));
  setTimeout(()=>{if(!document.getElementById('rText')||READ.page!==READ.pageAt)return;turnPage(1);},1500);READ.pageAt=READ.page;
}
function turnPage(d){
  const b=READ.book;const np=READ.page+d;
  if(np<0)return;
  if(np>=b.pages.length){spendReading();micStop(true);stopTalking();return startBookQuiz();}
  READ.page=np;drawPage();
  if(READ.want)sparkySays(pick(['Ready for the next page!','I’m still listening. Go ahead!','New page — you’ve got this!']),'happy');
}

// ── after the story: questions + "find the proof" ──
function startBookQuiz(){

}
function quizShell(inner){

    <div class="topbar" style="background:${col}"><button class="tb-back" onclick="closeBook()" aria-label="Back">←</button>

    <div class="act-body" id="qBody">${inner}</div></div>`);
}
function quizQuestion(){
  const q=READ.book.qs[READ.qi];READ.qAnswered=false;READ.order=shuf(q.o.slice());
  quizShell(`<div class="qc">
    <div class="q-top"><span class="q-badge" style="background:#9B5DE518;color:#6D28D9">${q.kind}</span>
    <button class="speak-mini" onclick="quizSpeak()" aria-label="Read the question to me">🔊</button></div>
    <div class="q-text">${esc(q.q)}</div><div class="hintbox" id="hintBox">💡 ${esc(q.hint)}</div>
    <div class="opts" id="opts">${READ.order.map((o,i)=>`<button class="opt" data-i="${i}" onclick="quizPick(${i})"><span class="opt-l">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div></div>
    <div id="fbCard"></div>
    <div class="btns" id="actBtns"><button class="btn btn-sec" onclick="showHint()">💡 Hint</button>
      <button class="btn btn-sec" onclick="peekStory()">📖 Look back at the story</button></div>`);
}
function peekStory(){
  const b=READ.book;const box=document.getElementById('fbCard');
  box.className='fb2 info';box.innerHTML=`<div class="fb2-h">The story</div>`+b.pages.map((p,i)=>`<p class="peek"><b>Page ${i+1}.</b> ${p.t.map(esc).join(' ')}</p>`).join('');
}
function quizSpeak(){const q=READ.book.qs[READ.qi];const keys=['q'+READ.qi].concat(READ.order.map(o=>'q'+READ.qi+'o'+q.o.indexOf(o)));
  if(!keys.every(k=>narrOK(READ.book.id,k))){sayText(q.q+' '+READ.order.join('. '),.88);return;}
  narrSeq(READ.book.id,keys).then(ok=>{if(!ok)sayText(q.q+' '+READ.order.join('. '),.88);});}
function quizPick(i){
  if(READ.qAnswered)return;READ.qAnswered=true;const q=READ.book.qs[READ.qi];const ok=READ.order[i]===q.a;
  document.querySelectorAll('#opts .opt').forEach(btn=>{btn.disabled=true;const bi=+btn.dataset.i;
    if(READ.order[bi]===q.a)btn.classList.add('correct');else if(bi===i)btn.classList.add('wrong');else btn.classList.add('faded');});
  const r=rstate();r.qN++;if(ok){r.qC++;READ.qC++;ST.xp+=5;FX.correct();}else FX.wrong();
  ST.totalQ++;if(ok)ST.totalC++;const d=dayRec();d.q++;if(ok)d.c++;
  ST.streak=ok?ST.streak+1:0;ST.bestStreak=Math.max(ST.bestStreak||0,ST.streak);
  const fb=document.getElementById('fbCard');
  fb.className='fb2 '+(ok?'ok':'err');
  fb.innerHTML=ok?`<div class="fb2-h">🎉 Yes! Now find the proof.</div><div class="fb2-b">Tap the sentence in the story that shows the answer.</div>`
    :`<div class="fb2-h">Good try! The answer is “${esc(q.a)}”.</div><div class="fb2-b">Let’s find the sentence in the story that shows it.</div>`;
  proofStep();save();checkAch();
}
function proofStep(){
  const b=READ.book;READ.proofTries=0;
  const list=document.createElement('div');list.className='proof qc';list.id='proofList';
  list.innerHTML=`<div class="les-k" style="color:#6D28D9">🔎 Find the proof</div>`+b.pages.map((p,pi)=>`<div class="proof-pg"><span class="proof-n">Page ${pi+1}</span>${p.t.map((s,si)=>`<button class="proof-s" data-p="${pi}" data-s="${si}" onclick="proofPick(this)">${esc(s)}</button>`).join('')}</div>`).join('');

  document.getElementById('actBtns').innerHTML='';
  list.scrollIntoView&&list.scrollIntoView({behavior:'smooth',block:'start'});
}
function proofPick(btn){
  const q=READ.book.qs[READ.qi];const p=+btn.dataset.p,s=+btn.dataset.s;
  const ok=q.ev.some(e=>e[0]===p&&e[1]===s);READ.proofTries++;
  const r=rstate();
  if(ok){btn.classList.add('ok');if(READ.proofTries===1){READ.proofC++;r.proofC++;ST.xp+=3;}r.proofN++;FX.correct();

  else{btn.classList.add('no');btn.disabled=true;FX.wrong();
    if(READ.proofTries>=2){r.proofN++;q.ev.forEach(e=>{const el=document.querySelector(`.proof-s[data-p="${e[0]}"][data-s="${e[1]}"]`);if(el)el.classList.add('ok');});
      document.querySelectorAll('.proof-s').forEach(b=>b.disabled=true);
      const fb=document.getElementById('fbCard');fb.className='fb2 info';
      fb.innerHTML=`<div class="fb2-h">Here’s the proof, in green.</div><div class="fb2-b">${esc(q.why)}</div>`;proofDone();}
    else{const fb=document.getElementById('fbCard');fb.className='fb2 err';fb.innerHTML=`<div class="fb2-h">Not that one — try again.</div><div class="fb2-b">💡 ${esc(q.hint)}</div>`;}}
  save();
}
function proofDone(){
  const last=READ.qi>=READ.qN-1;
  document.getElementById('actBtns').innerHTML=`<button class="btn btn-pri big" id="nextBtn" style="background:${BOOK_LEVELS[READ.book.level].color}" onclick="${last?'finishBook()':'READ.qi++;quizQuestion()'}">${last?'See my sticker':'Next question'}</button>`;

function finishBook(){

// ── Sound Swap ──
const SWAP={};
function startSwap(){
  const lv=Math.min(myLevel(),2);Object.assign(SWAP,{lv,items:shuf(SWAPS[lv].map((s,i)=>s.concat([i]))).slice(0,8),i:0,c:0});narrLoad('swap');swapRound();
}
function swapRound(){
  const it=SWAP.items[SWAP.i];const [w,idx,nl,ans,x1,x2]=it;SWAP.opts=shuf([ans,x1,x2]);SWAP.done=false;
  setScreen(`<div class="screen active">
    <div class="topbar" style="background:#9B5DE5"><button class="tb-back" onclick="renderDash();switchTab('stories')" aria-label="Back">←</button>
      <div class="tb-user"><div class="tb-name" style="color:#fff">Sound Swap</div><div class="tb-sub" style="color:rgba(255,255,255,.92)">Word ${SWAP.i+1} of ${SWAP.items.length} · ${SWAP.c} right</div></div></div>
    <div class="act-body"><div class="qc swap">
      <div class="swap-say">Read the word:</div>
      <div class="tiles" id="tiles">${w.split('').map((ch,i)=>`<span class="tile${i===idx?' hi':''}">${ch}</span>`).join('')}</div>
      <div class="q-text" style="text-align:center">Change <b class="lt">${w[idx]}</b> to <b class="lt new">${nl}</b>. What word do you make?</div>
      <button class="btn btn-sec speak" onclick="narrOrSay('swap','s${SWAP.lv}:${it[6]}','${w}. Change ${w[idx]} to ${nl}.',.8)">🔊 Hear it</button>
      <div class="opts swap-opts" id="opts">${SWAP.opts.map((o,i)=>`<button class="opt" data-i="${i}" onclick="swapPick(${i})"><span>${o}</span></button>`).join('')}</div></div>
      <div id="fbCard"></div><div class="btns" id="actBtns"></div></div></div>`);
}
function swapPick(i){
  if(SWAP.done)return;SWAP.done=true;const it=SWAP.items[SWAP.i];const ok=SWAP.opts[i]===it[3];
  document.querySelectorAll('#opts .opt').forEach(b=>{b.disabled=true;const bi=+b.dataset.i;
    if(SWAP.opts[bi]===it[3])b.classList.add('correct');else if(bi===i)b.classList.add('wrong');else b.classList.add('faded');});
  const t=document.querySelectorAll('#tiles .tile')[it[1]];if(t){t.textContent=it[2];t.classList.add('swapped');}
  const r=rstate();r.swapN++;if(ok){r.swapC++;SWAP.c++;ST.xp+=2;FX.correct();}else FX.wrong();
  narrOrSay('swap','sw:'+it[3],it[3],.8);
  const fb=document.getElementById('fbCard');fb.className='fb2 '+(ok?'ok':'err');
  fb.innerHTML=ok?`<div class="fb2-h">🎉 Yes — ${esc(it[0])} becomes ${esc(it[3])}!</div>`:`<div class="fb2-h">Look at the tiles: ${esc(it[0])} becomes ${esc(it[3])}.</div><div class="fb2-b">Only one letter changed. Read the new word slowly.</div>`;
  const last=SWAP.i>=SWAP.items.length-1;
  document.getElementById('actBtns').innerHTML=`<button class="btn btn-pri big" id="nextBtn" style="background:#9B5DE5" onclick="${last?'swapEnd()':'SWAP.i++;swapRound()'}">${last?'Finish':'Next word'}</button>`;
  save();
}
function swapEnd(){
  addXP(5,SWAP.c>=6?2:0);FX.win();
  setScreen(`<div class="screen active"><div class="topbar" style="background:#9B5DE5"><div class="tb-user"><div class="tb-name" style="color:#fff">Sound Swap</div></div></div>
    <div class="act-body"><div class="qc mastery"><div class="mastery-art">${mascot(96,'cheer')}</div>
    <div class="m-t">${SWAP.c} of ${SWAP.items.length} words!</div><p class="m-d">Changing one sound makes a whole new word. Great ears and eyes!</p>
    <div class="btns"><button class="btn btn-sec" onclick="startSwap()">Play again</button><button class="btn btn-pri" style="background:#9B5DE5" onclick="renderDash();switchTab('stories')">Back to stories</button></div></div></div></div>`);
}
