:root{
  --math:#2563EB;--math-lt:#DBEAFE;--math-dk:#1E3A8A;
  --read:#059669;--read-lt:#D1FAE5;--read-dk:#065F46;
  --sci:#EA580C;--sci-lt:#FFEDD5;--sci-dk:#9A3412;
  --write:#DB2777;--write-lt:#FCE7F3;--write-dk:#9D174D;
  --game:#7C3AED;--game-lt:#EDE9FE;--game-dk:#5B21B6;
  --gold:#F59E0B;--gold-lt:#FEF3C7;
  --ok:#10B981;--err:#EF4444;--neutral:#64748B;
  --bg:#F1F5F9;--card:#fff;--ink:#0F172A;
  --shadow:0 2px 14px rgba(0,0,0,.07);--shadow-lg:0 12px 44px rgba(0,0,0,.16);
  --r:16px;--r-sm:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',sans-serif;background:var(--bg);min-height:100vh;overflow-x:hidden;color:var(--ink)}
.screen{display:none;min-height:100vh;flex-direction:column}
.screen.active{display:flex}
.hidden{display:none!important}

/* WELCOME */
#welcome{background:linear-gradient(150deg,#0B1120 0%,#1E1B4B 55%,#0B1120 100%);align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
#welcome::before,#welcome::after{content:'';position:absolute;border-radius:50%;pointer-events:none}
#welcome::before{width:520px;height:520px;background:radial-gradient(circle,rgba(124,58,237,.2),transparent 70%);top:-90px;left:-90px}
#welcome::after{width:420px;height:420px;background:radial-gradient(circle,rgba(37,99,235,.16),transparent 70%);bottom:-70px;right:-70px}
.w-inner{position:relative;z-index:1;width:100%;max-width:460px;text-align:center}
.w-logo{font-size:3.6rem;margin-bottom:10px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.w-title{font-family:'Fredoka',cursive;font-size:2.7rem;color:#fff;letter-spacing:1px}
.w-badge{display:inline-block;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:4px 14px;color:#C7D2FE;font-size:.8rem;font-weight:700;margin:8px 0 32px;letter-spacing:.5px}
.w-card{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.13);border-radius:24px;padding:30px;backdrop-filter:blur(14px)}
.f-label{color:#CBD5E1;font-size:.82rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;text-align:left;margin-bottom:8px}
.f-input{width:100%;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.2);border-radius:12px;padding:14px 18px;font-family:'Nunito';font-size:1.05rem;font-weight:700;color:#fff;outline:none;margin-bottom:20px;transition:.2s}
.f-input::placeholder{color:rgba(255,255,255,.35)}
.f-input:focus{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.15)}
.g-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:24px}
.g-btn{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.16);border-radius:12px;padding:12px 6px;color:rgba(255,255,255,.72);font-family:'Nunito';font-size:.92rem;font-weight:800;cursor:pointer;transition:.2s}
.g-btn:hover{background:rgba(255,255,255,.15)}
.g-btn.sel{background:rgba(124,58,237,.45);border-color:#7C3AED;color:#fff;transform:scale(1.04)}
.go-btn{width:100%;padding:16px;border:none;border-radius:14px;font-family:'Nunito';font-size:1.1rem;font-weight:900;cursor:pointer;color:#fff;background:linear-gradient(135deg,#7C3AED,#2563EB);transition:.25s;letter-spacing:.5px}
.go-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 34px rgba(124,58,237,.45)}
.go-btn:disabled{opacity:.4;cursor:not-allowed}

/* TOPNAV */
.topbar{display:flex;align-items:center;gap:10px;padding:14px 18px;background:#fff;box-shadow:var(--shadow);position:sticky;top:0;z-index:100}
.tb-back{background:#F1F5F9;border:none;border-radius:50%;width:40px;height:40px;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0}
.tb-back:hover{background:#E2E8F0;transform:scale(1.08)}
.tb-user{flex:1;min-width:0}
.tb-name{font-family:'Fredoka',cursive;font-size:1.15rem;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-sub{font-size:.76rem;color:var(--neutral)}
.tb-chip{border-radius:18px;padding:5px 12px;font-weight:800;font-size:.85rem;white-space:nowrap}
.tb-xp{background:#ECFDF5;border:1.5px solid var(--ok);color:#065F46}
.tb-star{background:var(--gold-lt);border:1.5px solid var(--gold);color:#92400E}

/* DASHBOARD */
#dash{background:var(--bg)}
.dash-top{background:linear-gradient(135deg,#1E293B,#334155);padding:20px 18px 26px;color:#fff}
.dash-hi{font-family:'Fredoka',cursive;font-size:1.5rem;margin-bottom:2px}
.dash-tag{color:#CBD5E1;font-size:.88rem}
.dash-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.dstat{background:rgba(255,255,255,.1);border-radius:12px;padding:10px 6px;text-align:center}
.dstat-n{font-family:'Fredoka',cursive;font-size:1.3rem}
.dstat-l{font-size:.62rem;text-transform:uppercase;letter-spacing:.5px;color:#CBD5E1;font-weight:700;margin-top:2px}
.dash-body{padding:18px}
.tabs{display:flex;gap:8px;margin-bottom:18px;background:#E2E8F0;padding:5px;border-radius:14px}
.tab{flex:1;padding:11px;border:none;background:transparent;border-radius:10px;font-family:'Nunito';font-size:.95rem;font-weight:800;color:var(--neutral);cursor:pointer;transition:.2s}
.tab.active{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.sec-title{font-family:'Fredoka',cursive;font-size:1.15rem;margin-bottom:12px}

.subj-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
.subj{background:#fff;border-radius:18px;padding:20px 16px;cursor:pointer;transition:.28s cubic-bezier(.34,1.56,.64,1);box-shadow:var(--shadow);border:2px solid transparent;position:relative;overflow:hidden}
.subj::after{content:'';position:absolute;top:-18px;right:-18px;width:70px;height:70px;border-radius:50%;opacity:.1}
.subj:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.subj.math::after{background:var(--math)}.subj.read::after{background:var(--read)}
.subj.sci::after{background:var(--sci)}.subj.write::after{background:var(--write)}
.subj.math:hover{border-color:var(--math)}.subj.read:hover{border-color:var(--read)}
.subj.sci:hover{border-color:var(--sci)}.subj.write:hover{border-color:var(--write)}
.subj-ic{font-size:2rem;margin-bottom:6px;display:block}
.subj-t{font-family:'Fredoka',cursive;font-size:1.1rem;margin-bottom:2px}
.subj-d{font-size:.76rem;color:var(--neutral);line-height:1.4;margin-bottom:10px}
.subj-bar{height:5px;background:#F1F5F9;border-radius:4px;overflow:hidden}
.subj-fill{height:100%;border-radius:4px;transition:.5s}
.subj-n{font-size:.74rem;font-weight:700;color:var(--neutral);margin-top:5px}

.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:13px}
.gcard{border-radius:18px;padding:20px 14px;cursor:pointer;transition:.28s cubic-bezier(.34,1.56,.64,1);box-shadow:var(--shadow);text-align:center;color:#fff;position:relative;overflow:hidden}
.gcard:hover{transform:translateY(-5px) scale(1.02);box-shadow:var(--shadow-lg)}
.gcard-ic{font-size:2.6rem;margin-bottom:8px;display:block}
.gcard-t{font-family:'Fredoka',cursive;font-size:1.05rem;line-height:1.2}
.gcard-d{font-size:.72rem;opacity:.9;margin-top:4px;font-weight:600}
.gcard-hi{position:absolute;top:8px;right:10px;background:rgba(255,255,255,.25);border-radius:10px;padding:2px 8px;font-size:.68rem;font-weight:800}

/* STRANDS */
#strands{background:var(--bg)}
.strand-body{padding:16px 18px}
.strand-intro{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow);font-size:.85rem;color:var(--neutral);line-height:1.5}
.strand-row{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:9px;cursor:pointer;transition:.2s;box-shadow:var(--shadow);border:2px solid transparent;display:flex;align-items:center;gap:12px}
.strand-row:hover{transform:translateX(4px)}
.strand-code{font-family:'Fredoka',cursive;font-size:.95rem;color:#fff;border-radius:9px;padding:6px 10px;flex-shrink:0;min-width:52px;text-align:center}
.strand-info{flex:1;min-width:0}
.strand-name{font-weight:800;font-size:.96rem}
.strand-desc{font-size:.78rem;color:var(--neutral);margin-top:1px}
.strand-badge{font-size:.72rem;font-weight:800;padding:4px 9px;border-radius:8px;flex-shrink:0}

/* ACTIVITY */
#activity{background:var(--bg)}
.act-top{padding:13px 18px 11px;display:flex;align-items:center;gap:10px}
.act-t{font-family:'Fredoka',cursive;font-size:1.05rem;color:#fff;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act-pill{background:rgba(255,255,255,.22);color:#fff;border-radius:10px;padding:4px 11px;font-size:.8rem;font-weight:800}
.act-pbar{height:4px;background:rgba(255,255,255,.2);margin:0 18px}
.act-pfill{height:100%;background:rgba(255,255,255,.85);border-radius:2px;transition:.3s}
.act-body{flex:1;padding:16px 18px 30px;max-width:720px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:15px}

.qc{background:#fff;border-radius:18px;padding:22px;box-shadow:var(--shadow);animation:slideUp .3s ease both}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.q-badge{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:4px 10px;border-radius:7px;margin-bottom:10px}
.sol-tag{display:inline-block;font-size:.68rem;font-weight:800;color:#fff;background:var(--neutral);border-radius:6px;padding:3px 8px;margin-bottom:10px;margin-left:6px}
.passage{background:#F8FAFC;border-left:4px solid;border-radius:8px;padding:14px 18px;font-size:1rem;line-height:1.7;margin-bottom:16px;color:#1E293B}
.q-text{font-size:1.08rem;font-weight:700;line-height:1.5;margin-bottom:16px}
.hintbox{background:var(--gold-lt);border:1.5px solid var(--gold);border-radius:10px;padding:11px 15px;font-size:.87rem;color:#92400E;margin-bottom:14px;display:none}
.hintbox.show{display:block;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{background:#F8FAFC;border:2px solid #E2E8F0;border-radius:12px;padding:12px 16px;font-family:'Nunito';font-size:.98rem;font-weight:700;text-align:left;cursor:pointer;transition:.16s;display:flex;align-items:center;gap:10px;color:#1E293B}
.opt-l{width:28px;height:28px;border-radius:50%;background:#E2E8F0;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:900;flex-shrink:0;transition:.16s}
.opt:hover:not(:disabled){transform:translateX(4px)}
.opt.correct{background:#ECFDF5;border-color:var(--ok);color:#065F46}
.opt.correct .opt-l{background:var(--ok);color:#fff}
.opt.wrong{background:#FEF2F2;border-color:var(--err);color:#991B1B}
.opt.wrong .opt-l{background:var(--err);color:#fff}
.fb{border-radius:14px;padding:15px 18px;display:none;gap:10px;align-items:flex-start}
.fb.show{display:flex;animation:slideUp .25s}
.fb-ok{background:#ECFDF5;border:1.5px solid var(--ok)}.fb-ok .fb-t{color:#065F46}.fb-ok .fb-b{color:#047857}
.fb-err{background:#FEF2F2;border:1.5px solid var(--err)}.fb-err .fb-t{color:#991B1B}.fb-err .fb-b{color:#B91C1C}
.fb-ic{font-size:1.5rem}.fb-t{font-family:'Fredoka',cursive;font-size:1rem;margin-bottom:3px}.fb-b{font-size:.87rem;line-height:1.5}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:12px 22px;border:none;border-radius:12px;font-family:'Nunito';font-size:.92rem;font-weight:900;cursor:pointer;transition:.2s;flex:1;min-width:110px}
.btn:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.15)}
.btn-sec{background:#F1F5F9;color:var(--neutral)}.btn-pri{color:#fff}
.txt-in{width:100%;border:2px solid #E2E8F0;border-radius:12px;padding:12px 16px;font-family:'Nunito';font-size:1rem;font-weight:600;outline:none;resize:vertical;min-height:70px;transition:.2s}
.txt-in:focus{border-color:#94A3B8}

/* fill blank */
.fib-s{font-size:1.05rem;font-weight:700;line-height:2.2;margin-bottom:12px}
.fib-blank{display:inline-block;border-bottom:3px solid;min-width:70px;text-align:center;font-weight:900;padding:0 6px;border-radius:4px 4px 0 0}
.fib-opts{display:flex;gap:8px;flex-wrap:wrap}
.fib-o{background:#F1F5F9;border:2px solid #E2E8F0;border-radius:10px;padding:8px 16px;font-size:.95rem;font-weight:700;cursor:pointer;transition:.16s}
.fib-o:hover{transform:scale(1.04)}
.fib-o.correct-f{background:#ECFDF5;border-color:var(--ok);color:#065F46}
.fib-o.wrong-f{background:#FEF2F2;border-color:var(--err);color:#991B1B}

/* sentence build */
.wbank,.sdrop{display:flex;flex-wrap:wrap;gap:7px;border-radius:12px;padding:12px;min-height:46px;align-items:center}
.wbank{background:#F8FAFC;border:2px dashed #CBD5E1}
.sdrop{background:#fff;border:2px solid #CBD5E1;margin-top:8px}
.wchip{background:#fff;border:2px solid #E2E8F0;border-radius:8px;padding:6px 12px;font-size:.93rem;font-weight:700;cursor:pointer;transition:.15s;user-select:none}
.wchip:hover{transform:scale(1.06)}.wchip.used{opacity:.28;cursor:not-allowed}
.pchip{border-radius:8px;padding:6px 12px;font-size:.93rem;font-weight:700;cursor:pointer;transition:.15s}
.ph{color:#94A3B8;font-size:.88rem;font-style:italic}

/* visuals */
.nl-wrap{overflow-x:auto;padding:6px 0;margin:8px 0}
.nl{display:flex;align-items:center;min-width:max-content}
.nl-seg{display:flex;flex-direction:column;align-items:center;width:32px}
.nl-n{font-size:.68rem;font-weight:700;color:#64748B;margin-top:2px}
.nl-t{width:2px;height:9px;background:#CBD5E1}.nl-t.hi{background:var(--math);height:15px;width:3px}
.nl-l{height:2px;background:#CBD5E1;flex:1;min-width:20px}
.dots{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.dotg{background:#F1F5F9;border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:88px}
.dot{width:13px;height:13px;border-radius:50%}
.frac-vis{display:flex;gap:12px;margin:10px 0;flex-wrap:wrap}
.frac-bar{display:flex;border:2px solid #64748B;border-radius:6px;overflow:hidden;height:38px}
.frac-cell{border-right:1px solid #94A3B8;min-width:26px}
.frac-cell:last-child{border-right:none}
.frac-fill{background:var(--math)}
.shape-svg{margin:10px auto;display:block}

/* results */
.results{background:#fff;border-radius:22px;padding:34px 26px;text-align:center;box-shadow:var(--shadow-lg);animation:slideUp .35s}
.res-e{font-size:3.6rem;margin-bottom:8px;display:block}
.res-t{font-family:'Fredoka',cursive;font-size:1.8rem;margin-bottom:6px}
.res-s{font-family:'Fredoka',cursive;font-size:3rem;margin:12px 0}
.res-stars{font-size:1.7rem;letter-spacing:3px;margin-bottom:12px}
.res-m{color:var(--neutral);font-size:.94rem;line-height:1.6;margin-bottom:20px}
.xp-pop{display:inline-block;background:var(--gold-lt);border:1.5px solid var(--gold);border-radius:10px;padding:6px 16px;font-weight:800;color:#92400E;margin-bottom:16px}

/* achievement */
.ach{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1E293B;color:#fff;border-radius:14px;padding:13px 20px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow-lg);z-index:999;animation:achIn .4s cubic-bezier(.34,1.56,.64,1),achOut .5s 2.8s forwards;pointer-events:none}
@keyframes achIn{from{transform:translateX(-50%) translateY(20px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
@keyframes achOut{to{opacity:0;transform:translateX(-50%) translateY(-8px)}}
.ach-i{font-size:1.7rem}.ach-l{font-size:.7rem;color:#94A3B8;text-transform:uppercase;letter-spacing:.6px;font-weight:800}
.ach-n{font-family:'Fredoka',cursive;font-size:.98rem}

/* ═══ GAMES ═══ */
#game{background:linear-gradient(160deg,#0F172A,#1E293B);min-height:100vh}
.game-top{padding:14px 18px;display:flex;align-items:center;gap:10px;color:#fff}
.game-t{font-family:'Fredoka',cursive;font-size:1.15rem;flex:1}
.game-body{flex:1;padding:16px 18px 30px;max-width:640px;margin:0 auto;width:100%}
.game-stat-row{display:flex;gap:10px;justify-content:center;margin-bottom:18px}
.gstat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:8px 16px;text-align:center;color:#fff}
.gstat-n{font-family:'Fredoka',cursive;font-size:1.3rem}
.gstat-l{font-size:.62rem;text-transform:uppercase;letter-spacing:.6px;opacity:.8;font-weight:700}
.game-card{background:#fff;border-radius:20px;padding:26px 22px;box-shadow:var(--shadow-lg)}
.gq{font-family:'Fredoka',cursive;font-size:2.4rem;text-align:center;color:var(--ink);margin:14px 0 20px}
.g-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.g-opt{background:#F1F5F9;border:2px solid #E2E8F0;border-radius:14px;padding:18px;font-family:'Fredoka',cursive;font-size:1.4rem;cursor:pointer;transition:.15s;color:var(--ink)}
.g-opt:hover:not(:disabled){transform:scale(1.03);border-color:var(--game)}
.g-opt.correct{background:#ECFDF5;border-color:var(--ok);color:#065F46}
.g-opt.wrong{background:#FEF2F2;border-color:var(--err);color:#991B1B}
.timer-bar{height:8px;background:#E2E8F0;border-radius:4px;overflow:hidden;margin-bottom:18px}
.timer-fill{height:100%;background:linear-gradient(90deg,var(--ok),var(--gold),var(--err));border-radius:4px;transition:width .1s linear}
.lives{display:flex;gap:4px;justify-content:center;font-size:1.3rem;margin-bottom:10px}
.combo{text-align:center;font-family:'Fredoka',cursive;color:var(--game);font-size:1.1rem;height:24px}
.game-start{text-align:center;color:#fff;padding:30px 0}
.game-start-ic{font-size:4rem;margin-bottom:14px}
.game-start-t{font-family:'Fredoka',cursive;font-size:1.8rem;margin-bottom:8px}
.game-start-d{color:#CBD5E1;font-size:.95rem;line-height:1.6;margin-bottom:24px;max-width:400px;margin-left:auto;margin-right:auto}
.game-play-btn{background:linear-gradient(135deg,var(--game),#2563EB);color:#fff;border:none;border-radius:16px;padding:16px 44px;font-family:'Fredoka',cursive;font-size:1.2rem;cursor:pointer;transition:.2s}
.game-play-btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 12px 34px rgba(124,58,237,.5)}
.game-over{text-align:center;color:#fff;animation:slideUp .4s}
.go-emoji{font-size:4rem;margin-bottom:10px}
.go-t{font-family:'Fredoka',cursive;font-size:2rem;margin-bottom:6px}
.go-score{font-family:'Fredoka',cursive;font-size:3.4rem;color:var(--gold);margin:10px 0}
.go-hi{color:#CBD5E1;margin-bottom:20px}

/* fraction match */
.match-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.mcard{aspect-ratio:1;background:linear-gradient(135deg,var(--game),var(--game-dk));border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'Fredoka',cursive;font-size:1.2rem;color:#fff;cursor:pointer;transition:.2s;user-select:none;position:relative}
.mcard.flipped{background:#fff;color:var(--ink);border:2px solid var(--game)}
.mcard.matched{background:#ECFDF5;color:var(--ok);border:2px solid var(--ok);cursor:default;opacity:.7}
.mcard.wrong-match{background:#FEF2F2;border:2px solid var(--err)}

/* word wizard */
.ww-word{font-family:'Fredoka',cursive;font-size:2rem;text-align:center;color:var(--ink);margin:10px 0 6px}
.ww-prompt{text-align:center;color:var(--neutral);font-size:.9rem;margin-bottom:18px}
.ww-opts{display:flex;flex-direction:column;gap:9px}
.ww-opt{background:#F1F5F9;border:2px solid #E2E8F0;border-radius:12px;padding:14px 18px;font-size:1rem;font-weight:700;cursor:pointer;transition:.15s;text-align:center}
.ww-opt:hover:not(:disabled){transform:scale(1.02);border-color:var(--game)}
.ww-opt.correct{background:#ECFDF5;border-color:var(--ok);color:#065F46}
.ww-opt.wrong{background:#FEF2F2;border-color:var(--err);color:#991B1B}

/* logic commander */
.lc-wrap{display:flex;flex-direction:column;gap:12px}
.lc-badge{text-align:center;font-size:.78rem;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:1px}
.lc-desc{text-align:center;color:#CBD5E1;font-size:.85rem}
.grid-wrap{background:#0F172A;border-radius:16px;padding:14px;overflow:auto;display:flex;justify-content:center}
.grid{display:inline-grid;gap:3px;border:2px solid #334155;border-radius:8px;overflow:hidden}
.cell{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:1.15rem;transition:.15s;border-radius:2px}
.cell-empty{background:#1E293B}.cell-wall{background:#0B1120}.cell-goal{background:#1E293B}.cell-char{background:#1E293B}
.goal-ring{animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.cmd-panel{background:#fff;border-radius:14px;padding:14px}
.cmd-title{font-size:.76rem;font-weight:800;color:var(--neutral);text-transform:uppercase;letter-spacing:1px;margin-bottom:9px}
.cmd-btns{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}
.cmd-b{background:var(--game-lt);border:2px solid var(--game);border-radius:10px;padding:8px 13px;font-family:'Nunito';font-size:.85rem;font-weight:800;color:var(--game);cursor:pointer;transition:.16s}
.cmd-b:hover{background:var(--game);color:#fff;transform:scale(1.04)}
.seq-wrap{background:#F8FAFC;border:1.5px solid #E2E8F0;border-radius:10px;padding:9px 13px;min-height:42px;margin-bottom:11px}
.seq-list{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seq-i{background:var(--game);color:#fff;border-radius:7px;padding:4px 10px;font-size:.78rem;font-weight:800;cursor:pointer}
.seq-i:hover{background:var(--game-dk);text-decoration:line-through}
.seq-e{color:#94A3B8;font-size:.84rem;font-style:italic}
.lc-actions{display:flex;gap:8px}
.run-b{flex:2;padding:11px;background:linear-gradient(135deg,var(--game-dk),var(--game));color:#fff;border:none;border-radius:11px;font-family:'Nunito';font-size:.96rem;font-weight:900;cursor:pointer;transition:.2s}
.run-b:hover:not(:disabled){transform:translateY(-2px)}.run-b:disabled{opacity:.5}
.clr-b{flex:1;padding:11px;background:#F1F5F9;color:var(--neutral);border:none;border-radius:11px;font-family:'Nunito';font-size:.88rem;font-weight:800;cursor:pointer}
.lc-msg{text-align:center;font-size:.88rem;font-weight:700;padding:8px;border-radius:8px;display:none;color:#fff}
.lc-msg.show{display:block}
.lc-msg.win{background:rgba(16,185,129,.2)}.lc-msg.lose{background:rgba(239,68,68,.2)}.lc-msg.run{background:rgba(37,99,235,.2)}

/* sound toggle button */
.snd-btn{background:rgba(255,255,255,.15);border:none;border-radius:50%;width:38px;height:38px;font-size:1rem;cursor:pointer;flex-shrink:0}
.snd-btn:hover{background:rgba(255,255,255,.25)}

/* canvas games */
.ast-prompt{text-align:center;font-family:'Fredoka',cursive;font-size:1.5rem;color:#fff;margin-bottom:10px;background:rgba(255,255,255,.08);border-radius:12px;padding:10px}
.ast-canvas{display:block;margin:0 auto;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:100%;touch-action:none;cursor:crosshair}
.ast-hint{text-align:center;color:#94A3B8;font-size:.82rem;margin-top:10px;font-weight:600}

/* hp bars */
.hp-bar{background:rgba(255,255,255,.15);border-radius:8px;height:16px;overflow:hidden}
.hp-fill{height:100%;transition:width .4s}

/* codebot */
.cb-wrap{display:flex;flex-direction:column;gap:11px}
.cb-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cb-concept{background:var(--game);color:#fff;font-family:'Fredoka',cursive;font-size:.82rem;letter-spacing:1px;padding:5px 14px;border-radius:20px}
.cb-par{color:#CBD5E1;font-size:.76rem;font-weight:700}
.cb-desc{text-align:center;color:#CBD5E1;font-size:.86rem;line-height:1.4}
.cb-lvl{background:#fff;border-radius:14px;padding:13px 15px;margin-bottom:9px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:.2s}
.cb-lvl:hover{transform:translateX(4px)}
.cb-lvl.locked{background:rgba(255,255,255,.08);cursor:not-allowed;opacity:.55}
.cb-lvl-num{font-family:'Fredoka',cursive;font-size:1.1rem;color:#fff;border-radius:10px;padding:6px 13px;min-width:44px;text-align:center;flex-shrink:0}
.cb-lvl-name{font-weight:800;color:var(--ink)}
.cb-lvl.locked .cb-lvl-name{color:#fff}
.cb-lvl-desc{font-size:.78rem;color:var(--neutral);margin-top:1px}
.cb-lvl.locked .cb-lvl-desc{color:rgba(255,255,255,.6)}
.cmd-loop{background:#F3E8FF!important;border-color:var(--game-dk)!important}
.seq-loop{display:inline-flex;align-items:center;gap:3px;background:#F3E8FF;border:1.5px dashed var(--game);border-radius:9px;padding:3px 6px;cursor:pointer}
.seq-loop:hover{background:#EDE9FE}
.seq-loop-h{font-size:.72rem;font-weight:800;color:var(--game-dk);margin-right:2px}
.seq-i-in{background:var(--game-dk)!important;font-size:.72rem!important}

@media(max-width:480px){
  .subj-grid{grid-template-columns:1fr}
  .dash-stats{grid-template-columns:repeat(2,1fr)}
  .g-grid{grid-template-columns:repeat(2,1fr)}
  .match-grid{grid-template-columns:repeat(4,1fr);gap:6px}
  .mcard{font-size:.95rem}
  .cell{width:32px;height:32px;font-size:1rem}
  .gq{font-size:2rem}
  .ast-prompt{font-size:1.2rem}
}

/* ═══════════ PLATFORM LAYER ═══════════ */
button{font-family:'Nunito',sans-serif;color:inherit}
button.subj,button.gcard,button.rec,button.review-card,button.skill-main,button.who-card{display:block;width:100%;text-align:left;border:none;font:inherit}
button.gcard{text-align:center}
:focus-visible{outline:3px solid #7C3AED;outline-offset:2px}
.muted{color:var(--neutral);font-size:.85rem;line-height:1.5}
.empty{background:#fff;border:2px dashed #E2E8F0;border-radius:14px;padding:22px;text-align:center;color:var(--neutral);font-size:.9rem}

/* rings */
.ring{border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),#E2E8F0 0);display:grid;place-items:center;position:relative;flex-shrink:0;transition:background .5s}
.ring::before{content:'';position:absolute;inset:12%;background:#fff;border-radius:50%}
.ring span{position:relative;font-family:'Fredoka One',cursive;color:var(--ink);line-height:1}
.ring-done span{font-family:inherit}
.home-top .ring::before{background:#1E293B}
.home-top .ring span{color:#fff;font-size:15px!important}

/* who's learning */
.who{background:linear-gradient(150deg,#0B1120 0%,#1E1B4B 55%,#0B1120 100%);align-items:center;justify-content:center;padding:28px 16px}
.who-in{width:100%;max-width:620px;text-align:center}
.brand{font-family:'Fredoka One',cursive;color:#fff;font-size:2.3rem;display:flex;align-items:center;justify-content:center;gap:10px}
.brand-ic{animation:float 3s ease-in-out infinite;display:inline-block}
.brand-sub{color:#C7D2FE;font-weight:700;margin:4px 0 26px}
.who-h{font-family:'Fredoka One',cursive;font-weight:400;color:#fff;font-size:1.6rem;margin-bottom:18px}
.who-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
button.who-card{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.15);border-radius:20px;padding:22px 12px;text-align:center;color:#fff;cursor:pointer;transition:.2s}
.who-card:hover{background:rgba(255,255,255,.14);transform:translateY(-3px)}
.who-av{display:block;font-size:3rem;margin-bottom:8px}
.who-n{display:block;font-weight:900;font-size:1.1rem}
.who-g{display:block;font-size:.8rem;color:#C7D2FE;margin-top:2px}
.who-add .who-av{font-size:2.4rem;width:64px;height:64px;line-height:64px;margin:0 auto 8px;border-radius:50%;border:2px dashed rgba(255,255,255,.35)}
.av-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:20px}
.av-btn{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);border-radius:12px;font-size:1.5rem;padding:6px 0;cursor:pointer}
.av-btn.sel{background:rgba(124,58,237,.5);border-color:#A78BFA;transform:scale(1.08)}
.link-btn{background:none;border:none;color:#C7D2FE;font-weight:800;margin-top:14px;cursor:pointer;text-decoration:underline}
.who .w-card{text-align:left}

/* home */
.home-top{background:linear-gradient(135deg,#1E293B,#312E81);color:#fff;padding:16px 18px 20px}
.home-row{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:960px;margin:0 auto}
.me{display:flex;align-items:center;gap:12px;background:none;border:none;color:#fff;cursor:pointer;text-align:left;padding:4px;border-radius:14px}
.me:hover{background:rgba(255,255,255,.08)}
.me-av{font-size:2.3rem;width:52px;height:52px;display:grid;place-items:center;background:rgba(255,255,255,.12);border-radius:50%}
.me-hi{display:block;font-family:'Fredoka One',cursive;font-size:1.35rem}
.me-sub{display:block;font-size:.8rem;color:#CBD5E1}
.home-actions{display:flex;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:12px;border:none;background:rgba(255,255,255,.12);font-size:1.15rem;cursor:pointer;flex-shrink:0}
.icon-btn:hover{background:rgba(255,255,255,.22)}
.sheet .icon-btn,.report .icon-btn{background:#F1F5F9}
.today{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:14px 16px;margin:16px auto 0;max-width:960px}
.today-h{font-weight:900;font-size:1.05rem}
.today-d{color:#CBD5E1;font-size:.85rem;margin-top:2px}
.today-stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.today-stats div{background:rgba(255,255,255,.08);border-radius:12px;padding:8px 4px;text-align:center}
.today-stats b{display:block;font-family:'Fredoka One',cursive;font-weight:400;font-size:1.15rem}
.today-stats span{font-size:.62rem;text-transform:uppercase;letter-spacing:.5px;color:#CBD5E1;font-weight:800}
.home .dash-body{max-width:960px;margin:0 auto;width:100%}
.rec-list{display:grid;gap:10px;margin-bottom:20px}
button.rec{display:flex;align-items:center;gap:14px;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;transition:.2s}
.rec:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.rec-txt{flex:1;min-width:0}
.rec-k{display:block;font-size:.72rem;font-weight:900;text-transform:uppercase;letter-spacing:.5px}
.rec-n{display:block;font-weight:900;font-size:1rem}
.rec-s{display:block;font-size:.78rem;color:var(--neutral)}
.rec-go{color:#fff;border-radius:10px;padding:7px 14px;font-weight:900;font-size:.82rem;flex-shrink:0}
button.review-card{display:flex;align-items:center;gap:14px;background:#F5F3FF;border:2px solid #DDD6FE;border-radius:16px;padding:14px;margin:-6px 0 20px;cursor:pointer}
.review-ic{font-size:1.8rem}
.review-card small{color:#6D28D9}
.subj-grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.subj-t,.subj-d,.subj-n,.subj-ic{display:block}
.subj-bar{display:block}.subj-fill{display:block}
.award-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:22px}
.award{background:#fff;border-radius:16px;padding:16px 10px;text-align:center;box-shadow:var(--shadow)}
.award.locked{opacity:.55;filter:grayscale(1)}
.award-ic{font-size:2rem}.award-n{font-weight:900;margin-top:4px}.award-d{font-size:.74rem;color:var(--neutral);margin-top:2px}

/* skill map */
.strand-body{max-width:820px;margin:0 auto;width:100%}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:2px solid #E2E8F0;background:#fff;border-radius:999px;padding:7px 14px;font-weight:800;font-size:.85rem;cursor:pointer;color:var(--neutral)}
.chip.on{color:#fff}
.chip b{opacity:.75;margin-left:2px}
.fam{margin-bottom:18px}
.fam-h{display:flex;align-items:center;gap:8px;font-weight:900;font-size:.92rem;margin-bottom:8px;color:#334155}
.fam-code{color:#fff;border-radius:7px;padding:2px 8px;font-size:.75rem}
.skill{display:flex;gap:8px;margin-bottom:9px}
button.skill-main{flex:1;display:flex;align-items:center;gap:14px;background:#fff;border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;transition:.2s;min-width:0}
.skill-main:hover{transform:translateX(3px)}
.skill-info{flex:1;min-width:0}
.skill-code{display:inline-block;font-size:.68rem;font-weight:900;border-radius:6px;padding:2px 7px;margin-bottom:3px}
.skill-name{display:block;font-weight:900;font-size:.98rem}
.skill-desc{display:block;font-size:.78rem;color:var(--neutral)}
.skill-learn{width:52px;border:none;background:#fff;border-radius:14px;box-shadow:var(--shadow);font-size:1.3rem;cursor:pointer;flex-shrink:0}
.skill-learn:hover{background:#F8FAFC}
.lv{font-size:.7rem;font-weight:900;border-radius:999px;padding:4px 10px;white-space:nowrap;flex-shrink:0}
.lv0{background:#F1F5F9;color:#64748B}.lv1{background:#DBEAFE;color:#1E40AF}.lv2{background:#D1FAE5;color:#065F46}
.lv3{background:#EDE9FE;color:#5B21B6}.lv4{background:#FEF3C7;color:#92400E}

/* lesson */
.les-k{font-family:'Fredoka One',cursive;font-size:1.1rem;margin-bottom:10px}
.les-list{padding-left:20px;display:grid;gap:8px;line-height:1.55;font-size:1rem}
.les-list li::marker{color:#94A3B8}
.speak{margin-top:12px;flex:0;display:inline-block}
.ex-why{background:#F8FAFC;border-radius:10px;padding:10px 14px;margin-top:12px;font-size:.92rem;line-height:1.55}
.ex-ans{font-weight:900;color:#065F46;background:#ECFDF5;border-radius:10px;padding:10px 14px;margin-top:10px}
.race-m{border-left:4px solid #CBD5E1;background:#F8FAFC;border-radius:8px;padding:8px 12px;margin-top:8px;font-size:.92rem;line-height:1.5}
.opt.faded{opacity:.55}
div.opt{cursor:default}
.btn.big{padding:15px 22px;font-size:1rem}
.btn-danger{background:#FEF2F2;color:#B91C1C}

/* practice */
.act-sub{color:rgba(255,255,255,.85);font-size:.75rem;font-weight:700}
.act-finish{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:10px;padding:8px 14px;font-weight:900;cursor:pointer}
.prac{display:grid;grid-template-columns:1fr 200px;gap:16px;max-width:1000px;margin:0 auto;width:100%;padding:16px 18px 30px;align-items:start}
.prac-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.side{position:sticky;top:12px;display:grid;gap:10px}
.side-box{background:#fff;border-radius:14px;padding:12px;text-align:center;box-shadow:var(--shadow)}
.side-l{font-size:.68rem;font-weight:900;text-transform:uppercase;letter-spacing:.8px;color:var(--neutral);margin-bottom:4px}
.side-v{font-family:'Fredoka One',cursive;font-size:1.6rem}
.side-score #sRing{display:flex;justify-content:center;margin:4px 0}
.side-lv{display:inline-block;font-size:.7rem;font-weight:900;border-radius:999px;padding:3px 10px;margin-top:4px}
.q-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.q-top .q-badge,.q-top .sol-tag{margin:0}
.speak-mini{margin-left:auto;border:none;background:#F1F5F9;border-radius:10px;width:38px;height:34px;cursor:pointer;font-size:1rem}
.q-text{font-size:1.15rem}
.opt{font-size:1.02rem;padding:13px 16px}
.sm-label{font-size:.74rem;font-weight:900;color:#94A3B8;text-transform:uppercase;letter-spacing:.8px;margin:6px 0}
button.wchip,button.pchip{font:inherit;font-weight:800;cursor:pointer}
.pchip{background:#fff;border:2px solid}
.race-l{display:block;font-weight:900;font-size:.85rem;margin:10px 0 4px}
.fb2{border-radius:16px;padding:16px 18px;animation:slideUp .25s;line-height:1.55}
.fb2.ok{background:#ECFDF5;border:2px solid #A7F3D0}.fb2.ok .fb2-h{color:#065F46}
.fb2.err{background:#FFF7ED;border:2px solid #FED7AA}.fb2.err .fb2-h{color:#9A3412}
.fb2.info{background:#F8FAFC;border:2px solid #E2E8F0}
.fb2-h{font-family:'Fredoka One',cursive;font-size:1.1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fb2-ans{margin-top:6px;font-size:1rem}
.fb2-b{margin-top:6px;font-size:.93rem;color:#334155}
.gain{background:#10B981;color:#fff;border-radius:999px;padding:1px 9px;font-family:'Nunito';font-weight:900;font-size:.8rem}
.loss{background:#F97316;color:#fff;border-radius:999px;padding:1px 9px;font-family:'Nunito';font-weight:900;font-size:.8rem}
.fire{font-family:'Nunito';font-weight:900;font-size:.82rem;color:#EA580C}
.mastery,.summary{text-align:center}
.medal{font-size:4.5rem;animation:float 2.4s ease-in-out infinite}
.m-t{font-family:'Fredoka One',cursive;font-size:1.6rem;margin-top:6px}
.m-s{font-weight:800;color:var(--neutral)}
.m-d{max-width:440px;margin:10px auto 16px;line-height:1.55;color:#334155}
.sum-rings{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:6px}
.sum-rings>div{display:flex;flex-direction:column;align-items:center;gap:6px}
.sum-rings small{font-weight:800;color:var(--neutral)}
.sum-arrow{font-size:1.6rem;color:#94A3B8}
.sum-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}
.sum-grid div{background:#F8FAFC;border-radius:12px;padding:10px 4px}
.sum-grid b{display:block;font-family:'Fredoka One',cursive;font-weight:400;font-size:1.25rem}
.sum-grid span{font-size:.7rem;color:var(--neutral);font-weight:800;text-transform:uppercase}
.summary .xp-pop,.mastery .xp-pop{margin-bottom:14px}

/* settings sheet */
.sheet-wrap{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:900;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 18px 24px;animation:slideUp .25s;max-height:90vh;overflow:auto}
.sheet-h{display:flex;justify-content:space-between;align-items:center;font-family:'Fredoka One',cursive;font-size:1.3rem;margin-bottom:8px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #F1F5F9}
.set-row small{display:block;color:var(--neutral);font-size:.8rem}
.seg{display:flex;background:#F1F5F9;border-radius:10px;padding:3px}
.seg button{border:none;background:none;padding:6px 11px;border-radius:8px;font-weight:900;cursor:pointer;color:var(--neutral)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.toggle{width:50px;height:28px;border-radius:999px;border:none;background:#CBD5E1;position:relative;cursor:pointer;flex-shrink:0;transition:.2s}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on{background:#10B981}.toggle.on::after{left:25px}
.sheet-acts{display:grid;gap:8px;margin-top:16px}

/* parent report */
.report{background:#fff}
.report .topbar{box-shadow:none;border-bottom:1px solid #E2E8F0}
.rep{max-width:960px;margin:0 auto;width:100%;padding:20px 18px 40px}
.rep-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.rep-av{font-size:2.6rem}
.rep h1{font-family:'Fredoka One',cursive;font-weight:400;font-size:1.6rem}
.rep-head p{color:var(--neutral);font-size:.88rem}
.rep h2{font-family:'Fredoka One',cursive;font-weight:400;font-size:1.2rem;margin:22px 0 10px}
.rep-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.rep-tiles div{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:14px;padding:12px}
.rep-tiles b{display:block;font-family:'Fredoka One',cursive;font-weight:400;font-size:1.5rem}
.rep-tiles span{font-size:.76rem;color:var(--neutral);font-weight:700}
.bars{display:grid;grid-template-columns:repeat(14,1fr);gap:6px;height:150px;align-items:end}
.bar-col{display:flex;flex-direction:column;align-items:center;height:100%}
.bar-v{font-size:.68rem;font-weight:800;color:var(--neutral);height:16px}
.bar{flex:1;width:100%;max-width:28px;display:flex;align-items:flex-end}
.bar-c{width:100%;background:#CBD5E1;border-radius:6px 6px 2px 2px;display:flex;align-items:flex-end;overflow:hidden;min-height:2px}
.bar-ok{width:100%;background:#10B981}
.bar-l{font-size:.68rem;color:var(--neutral);font-weight:800;margin-top:4px}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--neutral);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.rep-two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.rep-box{border-radius:14px;padding:14px 16px;font-size:.88rem;line-height:1.5}
.rep-box h3{font-size:.95rem;margin-bottom:6px}
.rep-box ul{padding-left:18px;display:grid;gap:4px}
.rep-box.warn{background:#FFF7ED;border:1px solid #FED7AA}
.rep-box.good{background:#ECFDF5;border:1px solid #A7F3D0}
.tbl-wrap{overflow-x:auto;border:1px solid #E2E8F0;border-radius:12px}
.tbl{width:100%;border-collapse:collapse;font-size:.84rem}
.tbl th{background:#F8FAFC;text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;color:var(--neutral);padding:8px 10px;white-space:nowrap}
.tbl td{padding:8px 10px;border-top:1px solid #F1F5F9;white-space:nowrap}
.tbl td:nth-child(2){white-space:normal;min-width:160px;font-weight:700}
.tbl tr.dim td{color:#94A3B8}
.mini{display:inline-block;width:54px;height:6px;background:#E2E8F0;border-radius:3px;overflow:hidden;vertical-align:middle;margin-right:6px}
.mini div{height:100%}
.rep-note{margin-top:20px;font-size:.82rem;color:var(--neutral);line-height:1.55;background:#F8FAFC;border-radius:12px;padding:12px 14px}

@media (max-width:720px){
  .prac{grid-template-columns:1fr;padding:12px 14px 30px}
  .side{position:static;grid-template-columns:repeat(3,1fr);order:-1}
  .side-box{padding:8px 6px}
  .side-v{font-size:1.2rem}
  .side-score .ring{width:46px!important;height:46px!important;font-size:14px!important}
  .side-lv{display:none}
  .today-stats{grid-template-columns:repeat(4,1fr)}
  .rep-two{grid-template-columns:1fr}
  .av-grid{grid-template-columns:repeat(8,1fr)}
  .sum-grid{grid-template-columns:repeat(2,1fr)}
  .lv{display:none}
  .skill-learn{width:46px}
}
@media print{
  .no-print,.ach{display:none!important}
  body,.report{background:#fff}
  .rep{padding:0}
  .tbl-wrap{overflow:visible;border:none}
  .rep-box,.rep-tiles div,.tbl tr{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* polish fixes */
.ach{top:16px;bottom:auto}
.prac .btn-sec,.act-body .btn-sec{background:#fff;border:2px solid #E2E8F0;color:#475569}
.print-btn{border:none;background:#F1F5F9;border-radius:12px;padding:10px 16px;font-weight:900;cursor:pointer;white-space:nowrap}
.prac #actBtns .btn-sec{flex:0 0 auto}

/* ═══════════ THEME: math notebook + sticker book ═══════════ */
:root{
  --ink:#1F2A44;--paper:#F7F9FC;--line:#E3E9F3;--line-dk:#CBD6E8;
  --sky:#4C8DF6;--leaf:#2FB37A;--ember:#FF8A3D;--berry:#E8559A;--sun:#FFC83D;
  --bg:#F7F9FC;--neutral:#5B6B85;
  --display:'Fredoka',ui-rounded,'Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --shadow:0 4px 0 var(--line);--shadow-lg:0 6px 0 var(--line-dk);
}
body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);
  background-color:var(--paper);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:28px 28px;background-attachment:fixed}
#dash,#strands,#activity,.lesson,.screen[style*="var(--bg)"]{background:transparent!important}
h1,h2,h3,.sec-title,.tb-name,.act-t,.les-k,.m-t,.me-hi,.subj-t,.brand,.who-h,.fb2-h,.sheet-h,.rep h1,.rep h2,.side-v,.today-stats b,.sum-grid b,.rep-tiles b,.ring span,.award-n{font-family:var(--display);font-weight:600;letter-spacing:0}
.sec-title{font-size:1.3rem;margin:4px 0 12px}

/* sentence-case labels instead of tracked capitals */
.today-stats span,.side-l,.rec-k,.sm-label,.q-badge,.sum-grid span,.tbl th,.f-label{text-transform:none;letter-spacing:0}
.today-stats span{font-size:.74rem}.side-l{font-size:.8rem}.rec-k{font-size:.78rem}.sm-label{font-size:.82rem}
.q-badge{font-size:.8rem;font-weight:900}.sum-grid span{font-size:.78rem}.tbl th{font-size:.76rem}

/* sticker cards: solid edge instead of blurry shadow */
.qc,button.rec,button.skill-main,.skill-learn,button.subj,.side-box,.award,.empty,.strand-intro{background:#fff;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:20px}
button.rec,button.skill-main,.skill-learn,button.subj{transition:transform .12s,box-shadow .12s}
button.rec:hover,button.skill-main:hover,.skill-learn:hover,button.subj:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--line-dk);border-color:var(--line-dk)}
button.rec:active,button.skill-main:active,button.subj:active,.skill-learn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line-dk)}
.subj::after{display:none}
.empty{border-style:dashed;box-shadow:none;line-height:1.6}

/* pressable buttons */
.btn{border-radius:14px;font-weight:900;transition:transform .1s,box-shadow .1s}
.btn-pri{box-shadow:0 4px 0 rgba(31,42,68,.38)}
.btn-pri:hover{transform:translateY(-1px);box-shadow:0 5px 0 rgba(31,42,68,.38)}
.btn-pri:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(31,42,68,.38)}
.btn-sec,.prac .btn-sec,.act-body .btn-sec{background:#fff;border:2px solid var(--line-dk);color:var(--ink);box-shadow:0 3px 0 var(--line-dk)}
.btn-sec:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line-dk)}
.rec-go{box-shadow:0 3px 0 rgba(31,42,68,.3)}

/* answer choices */
.opt{background:#fff;border:2px solid var(--line-dk);box-shadow:0 3px 0 var(--line-dk);border-radius:16px;color:var(--ink);font-weight:800}
.opt:hover:not(:disabled){transform:translateY(-1px);border-color:#9DB4DA}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line-dk)}
.opt-l{border-radius:9px;background:var(--paper);border:2px solid var(--line-dk);width:30px;height:30px;font-family:var(--display);font-weight:600}
.opt.correct{background:#E8F8F0;border-color:var(--leaf);box-shadow:0 3px 0 var(--leaf);color:#0F5F3F}
.opt.correct .opt-l{background:var(--leaf);border-color:var(--leaf)}
.opt.wrong{background:#FFF0EC;border-color:#F06A4D;box-shadow:0 3px 0 #F06A4D;color:#9C2F17}
.opt.wrong .opt-l{background:#F06A4D;border-color:#F06A4D}
.opt.faded{opacity:.5}
.q-text{font-size:1.2rem;font-weight:800;line-height:1.5}
.passage{background:#FFFDF6;border:2px solid #F3E7C6;border-left-width:6px;border-radius:14px;font-size:1.04rem}
.hintbox{background:#FFF7DB;border:2px solid var(--sun);border-radius:14px;color:#6B4E00}
.sol-tag{border-radius:8px;font-size:.74rem;padding:4px 9px}

/* question pictures */
.dg-wrap{background-color:#FBFCFF;background-image:linear-gradient(#EEF2F9 1px,transparent 1px),linear-gradient(90deg,#EEF2F9 1px,transparent 1px);
  background-size:16px 16px;border:2px solid var(--line);border-radius:16px;padding:14px 10px;margin:0 0 16px;text-align:center}
.dg{width:100%;max-width:420px;height:auto;max-height:280px;display:inline-block}

/* coloured header bands */
.topbar,.act-top{position:relative;overflow:hidden;box-shadow:none}
.topbar{min-height:86px;padding:14px 18px}
.topbar .tb-back,.act-top .tb-back{background:#fff!important;color:var(--ink)!important;border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.tb-art{margin-left:auto;align-self:flex-end;margin-bottom:-22px;flex-shrink:0}
.tb-name{font-size:1.35rem}
.act-top{padding:14px 18px}
.act-finish{background:#fff;color:var(--ink);border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.act-t{font-size:1.2rem}

/* who's learning */
.who{background:var(--sky)!important;position:relative;overflow:hidden}
.who::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 12% 18%,rgba(255,255,255,.18) 0 70px,transparent 71px),radial-gradient(circle at 88% 82%,rgba(255,255,255,.14) 0 110px,transparent 111px);pointer-events:none}
.who-in{position:relative}
.who-mascot{display:flex;justify-content:center;margin-bottom:4px}

/* home */

/* skill map */

/* practice */

.rd-size{display:flex;gap:6px;margin-left:auto}

function blankLearner(name,grade,avatar){
  return {id:'p'+Date.now().toString(36)+Math.floor(Math.random()*1e4),name:name||'',grade:grade||4,avatar:avatar||'🦊',
    xp:0,stars:0,streak:0,bestStreak:0,totalQ:0,totalC:0,subjectN:{},strandN:{},achievements:[],gameHi:{},

const PROFILES={active:null,list:{}};
function storeGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function storeSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function loadProfiles(){
  const raw=storeGet('lsva_profiles');
  if(raw){try{const d=JSON.parse(raw);PROFILES.active=d.active;PROFILES.list=d.list||{};}catch(e){}}
  // one-time migration from the original single-learner save ('lsva')
  if(!Object.keys(PROFILES.list).length){
    const old=storeGet('lsva');
    if(old){try{const o=JSON.parse(old);if(o&&o.name){const p=Object.assign(blankLearner(o.name,o.grade),o);
      p.id=blankLearner().id;PROFILES.list[p.id]=p;PROFILES.active=p.id;}}catch(e){}}
  }
  Object.values(PROFILES.list).forEach(p=>{const b=blankLearner();for(const k of SAVE_FIELDS)if(p[k]===undefined)p[k]=b[k];});
}
function persistProfiles(){storeSet('lsva_profiles',JSON.stringify({active:PROFILES.active,list:PROFILES.list}));}
function activateProfile(id){
  const p=PROFILES.list[id];if(!p)return false;
  for(const k of Object.keys(ST))delete ST[k];
  Object.assign(ST,JSON.parse(JSON.stringify(p)),{tab:'learn'});
  PROFILES.active=id;persistProfiles();return true;
}
function save(){
  if(!ST.id)return;const out={};for(const k of SAVE_FIELDS)out[k]=ST[k];
  PROFILES.list[ST.id]=out;PROFILES.active=ST.id;persistProfiles();
}

// Hardened multiple-choice builder:
//  • removes duplicate options (a distractor colliding with the answer)
//  • guarantees the correct answer is always present
//  • always leaves at least 3 choices
function mcq(badge,sol,question,opts,answer,expl,hint,extra){
  const A=String(answer);
  // dedupe by string value, preserving order
  const seen=new Set(); const clean=[];
  for(const o of opts){const k=String(o); if(!seen.has(k)){seen.add(k); clean.push(o);} }
  // guarantee the answer is in the list
  if(!seen.has(A)){clean.unshift(answer); seen.add(A);}
  // if dedupe left us short, invent safe distractors (handles "$12" and "88 cm²" too)
  let guard=0;
  const m=A.match(/^([^\d\-]*)(-?\d+(?:\.\d+)?)(.*)$/); // prefix, number, suffix
  while(clean.length<3 && guard<60){
    guard++;
    if(!m)break;
    const prefix=m[1], base=parseFloat(m[2]), suffix=m[3];
    const dec=(m[2].split('.')[1]||'').length;
    const delta=(1+Math.floor(Math.random()*9))*(Math.random()<.5?-1:1);
    let val=base+delta;
    if(val<0)val=base+Math.abs(delta);
    const k=prefix+val.toFixed(dec)+suffix;
    if(!seen.has(k)){seen.add(k); clean.push(k);}
  }
  return Object.assign({type:'mc',badge,sol,question,opts:shuf(clean),answer,explanation:expl,hint},extra||{});
}

GEN.g4_place=()=>{
  const t=rng(0,5);
  if(t===0){const n=rng(1000,999999);const s=n.toString();const pos=rng(0,s.length-1);
    const d=+s[pos];const place=Math.pow(10,s.length-1-pos);const val=d*place;
    const pn={1:'ones',10:'tens',100:'hundreds',1000:'thousands',10000:'ten-thousands',100000:'hundred-thousands'}[place];
    return mcq('Place Value','4.1',`What is the value of the digit ${d} in ${n.toLocaleString()}?`,
      [val.toLocaleString(),String(d),(val*10).toLocaleString(),place.toLocaleString()],val.toLocaleString(),
      `The ${d} sits in the ${pn} place, so its value is ${d} × ${place.toLocaleString()} = ${val.toLocaleString()}.`,
      `Find which place the ${d} is in. Each place is worth 10 times the place to its right.`);}
  if(t===1){const n=rng(1000,99999);const r=Math.round(n/1000)*1000;
    return mcq('Rounding','4.1',`Round ${n.toLocaleString()} to the nearest thousand.`,
      [r.toLocaleString(),(r+1000).toLocaleString(),(r-1000).toLocaleString(),(Math.round(n/100)*100).toLocaleString()],r.toLocaleString(),
      `Look at the hundreds digit (${Math.floor(n/100)%10}). ${Math.floor(n/100)%10>=5?'5 or more → round up':'Less than 5 → round down'}. Answer: ${r.toLocaleString()}.`,
      `Look at the hundreds digit — 5 or more rounds up, less than 5 rounds down.`);}
  if(t===2){const n=rng(100,9999);const r=Math.round(n/100)*100;
    return mcq('Rounding','4.1',`Round ${n.toLocaleString()} to the nearest hundred.`,
      [r.toLocaleString(),(r+100).toLocaleString(),(r-100).toLocaleString(),(Math.round(n/10)*10).toLocaleString()],r.toLocaleString(),
      `Look at the tens digit (${Math.floor(n/10)%10}). ${Math.floor(n/10)%10>=5?'Round up':'Round down'} → ${r.toLocaleString()}.`,
      `The tens digit decides: 5 or more rounds up.`);}
  if(t===3){const a=rng(1000,99999),b=rng(1000,99999);
    return mcq('Compare','4.1',`Which symbol makes this true?   ${a.toLocaleString()} ___ ${b.toLocaleString()}`,
      ['<','>','='],a<b?'<':a>b?'>':'=',
      `Compare from the left. ${a.toLocaleString()} ${a<b?'<':a>b?'>':'='} ${b.toLocaleString()}.`,
      `Compare digit by digit starting at the biggest place value.`);}
  if(t===4){const n=rng(1000,99999);const s=n.toString();
    const expanded=s.split('').map((d,i)=>+d*Math.pow(10,s.length-1-i)).filter(v=>v>0);
    const correct=expanded.join(' + ');
    const wrong1=s.split('').filter(d=>+d>0).join(' + ');
    const wrong2=expanded.map(v=>v*10).join(' + ');
    return mcq('Expanded Form','4.1',`Which shows ${n.toLocaleString()} in expanded form?`,
      [correct,wrong1,wrong2],correct,
      `Each digit's value: ${correct} = ${n.toLocaleString()}.`,
      `Break the number apart by each digit's place value.`);}
  const n=rng(10000,999999);const words=['ten thousands','thousands','hundreds','tens'];
  const s=n.toString();const d1=+s[0];
  return mcq('Place Value','4.1',`In ${n.toLocaleString()}, which digit is in the thousands place?`,
    [s[s.length-4],s[s.length-3],s[s.length-2],s[s.length-1]],s[s.length-4],
    `Count from the right: ones, tens, hundreds, thousands. The thousands digit is ${s[s.length-4]}.`,
    `Count places from the RIGHT: ones, tens, hundreds, then thousands.`);
};

GEN.g4_frac=()=>{
  const t=rng(0,5);
  if(t===0){const d=pick([2,3,4,5,6,8]);const n=rng(1,d-1);const m=rng(2,4);
    return mcq('Equivalent Fractions','4.2',`Which fraction is equivalent to ${n}/${d}?`,
      [`${n*m}/${d*m}`,`${n+1}/${d}`,`${n}/${d+m}`,`${n*m}/${d}`],`${n*m}/${d*m}`,
      `Multiply top AND bottom by ${m}: ${n}×${m}=${n*m}, ${d}×${m}=${d*m}. So ${n}/${d} = ${n*m}/${d*m}.`,
      `Multiply the top and the bottom by the SAME number.`);}
  if(t===1){const d=pick([4,6,8,10,12]);let n1=rng(1,d-1),n2=rng(1,d-1);while(n1===n2)n2=rng(1,d-1);
    return mcq('Compare Fractions','4.2',`Which symbol makes this true?   ${n1}/${d} ___ ${n2}/${d}`,
      ['<','>','='],n1<n2?'<':'>',
      `Same denominator — compare the numerators. ${n1} ${n1<n2?'<':'>'} ${n2}.`,
      `When the bottoms match, the bigger top is the bigger fraction.`);}
  if(t===2){const n=rng(1,3);const d1=pick([4,6,8]);const d2=pick([2,3]);
    const v1=n/d1,v2=n/d2;
    return mcq('Compare Fractions','4.2',`Which symbol makes this true?   ${n}/${d1} ___ ${n}/${d2}`,
      ['<','>','='],v1<v2?'<':v1>v2?'>':'=',
      `Same numerator: the SMALLER denominator makes the BIGGER piece. ${n}/${d1} ${v1<v2?'<':'>'} ${n}/${d2}.`,
      `Same top? Then more pieces (bigger bottom) means SMALLER pieces.`);}
  if(t===3){const d=pick([4,6,8,10]);const n=rng(2,d-1);const g=gcd(n,d);
    if(g===1)return GEN.g4_frac();
    return mcq('Simplify','4.2',`Write ${n}/${d} in simplest form.`,
      [`${n/g}/${d/g}`,`${n}/${d}`,`${n-1}/${d-1}`,`${n*2}/${d*2}`],`${n/g}/${d/g}`,
      `The GCF of ${n} and ${d} is ${g}. Divide both by ${g}: ${n/g}/${d/g}.`,
      `Find the biggest number that divides BOTH the top and bottom.`);}
  if(t===4){const whole=rng(1,4);const d=pick([2,3,4,5]);const n=rng(1,d-1);
    const imp=whole*d+n;
    return mcq('Mixed Numbers','4.2',`Write ${whole} ${n}/${d} as an improper fraction.`,
      [`${imp}/${d}`,`${whole+n}/${d}`,`${imp}/${d+whole}`,`${whole*n}/${d}`],`${imp}/${d}`,
      `Multiply whole × bottom, then add top: (${whole}×${d})+${n} = ${imp}. Keep the bottom: ${imp}/${d}.`,
      `Whole × denominator + numerator, all over the same denominator.`);}
  const d=pick([4,6,8]);const shaded=rng(1,d-1);
  return mcq('Fractions','4.2',`A shape is divided into ${d} equal parts. ${shaded} part${shaded>1?'s are':' is'} shaded. What fraction is shaded?`,
    [`${shaded}/${d}`,`${d}/${shaded}`,`${d-shaded}/${d}`,`${shaded}/${d-shaded}`],`${shaded}/${d}`,
    `Shaded parts on top (${shaded}), total parts on bottom (${d}): ${shaded}/${d}.`,
    `Numerator = parts shaded. Denominator = total equal parts.`);
};

GEN.g6_prop=()=>{
  const t=rng(0,4);
  if(t===0){const a=rng(2,8),m=rng(2,6),c=a*m;const b=rng(2,9),d=b*m;
    return mcq('Solve Proportions','6.PFA.2',`Solve the proportion:   ${a}/${b} = ${c}/x`,
      [d,d+m,d-1,c],d,
      `${a} → ${c} is ×${m}. So x = ${b} × ${m} = ${d}. (Or cross-multiply: ${a}x = ${b}×${c}.)`,
      `Find what the top was multiplied by, then do the same to the bottom.`);}
  if(t===1){const items=rng(2,8),cost=rng(2,9)*items;
    return mcq('Unit Rate','6.PFA.2',`${items} notebooks cost $${cost}. What is the cost per notebook (unit rate)?`,
      [`$${cost/items}`,`$${cost*items}`,`$${cost-items}`,`$${(cost/items+1)}`],`$${cost/items}`,
      `Unit rate = total ÷ quantity = $${cost} ÷ ${items} = $${cost/items} each.`,
      `Unit rate means "for ONE" — divide the total by the number of items.`);}
  if(t===2){const miles=rng(2,9)*30,hrs=rng(2,5);
    if(miles%hrs!==0)return GEN.g6_prop();
    return mcq('Rate','6.PFA.2',`A car travels ${miles} miles in ${hrs} hours. What is its speed in miles per hour?`,
      [`${miles/hrs} mph`,`${miles*hrs} mph`,`${miles-hrs} mph`,`${miles/hrs+10} mph`],`${miles/hrs} mph`,
      `Speed = distance ÷ time = ${miles} ÷ ${hrs} = ${miles/hrs} mph.`,
      `"Per hour" means divide the distance by the number of hours.`);}
  if(t===3){const scale=rng(10,50);const inches=rng(2,8);const miles=scale*inches;
    return mcq('Scale','6.PFA.2',`A map scale is 1 inch = ${scale} miles. Two cities are ${inches} inches apart on the map. What is the ACTUAL distance?`,
      [`${miles} miles`,`${scale+inches} miles`,`${scale} miles`,`${miles/2} miles`],`${miles} miles`,
      `${inches} inches × ${scale} miles per inch = ${miles} miles.`,
      `Multiply the map distance by the scale.`);}
  const b1=rng(2,6),unit=rng(2,8);const q1=b1*unit;const b2=rng(7,12);const q2=b2*unit;
  return mcq('Better Buy','6.PFA.2',`Which is the better buy: ${b1} items for $${q1}, or ${b2} items for $${q2}?`,
    ['They cost the same per item',`${b1} for $${q1}`,`${b2} for $${q2}`,'Cannot tell'],
    'They cost the same per item',
    `Unit price: $${q1}÷${b1} = $${unit} each, and $${q2}÷${b2} = $${unit} each. Same rate!`,
    `Find the price PER ITEM for each option, then compare.`);
};

GEN.g6_stat=()=>{
  const t=rng(0,4);
  const data=[rng(2,12),rng(2,15),rng(2,15),rng(2,12),rng(2,10)].sort((a,b)=>a-b);
  const sum=data.reduce((a,b)=>a+b,0);
  if(t===0){const mean=sum/data.length;
    if(!Number.isInteger(mean))return GEN.g6_stat();
    return mcq('Mean','6.PS.2',`Data: ${data.join(', ')}\nWhat is the MEAN (average)?`,
      [mean,mean+2,mean-1,sum],mean,
      `Add: ${data.join('+')} = ${sum}. Divide by ${data.length}: ${sum} ÷ ${data.length} = ${mean}.`,
      `Mean = add all values, then divide by how many there are.`);}
  if(t===1)return mcq('Median','6.PS.2',`Data: ${data.join(', ')}\nWhat is the MEDIAN?`,
    [data[2],data[1],data[3],sum],data[2],
    `Already sorted. The middle value (3rd of 5) is ${data[2]}.`,
    `Sort the data, then find the MIDDLE value.`);
  if(t===2)return mcq('Range','6.PS.2',`Data: ${data.join(', ')}\nWhat is the RANGE?`,
    [data[4]-data[0],data[4]+data[0],data[4],data[0]],data[4]-data[0],
    `Range = largest − smallest = ${data[4]} − ${data[0]} = ${data[4]-data[0]}.`,
    `Range = biggest value minus smallest value.`);
  if(t===3){const d2=[rng(2,9),rng(2,9),rng(2,9),rng(2,9)];const m=d2[rng(0,3)];
    const withMode=[...d2,m].sort((a,b)=>a-b);
    return mcq('Mode','6.PS.2',`Data: ${withMode.join(', ')}\nWhat is the MODE?`,
      [m,withMode[0],withMode[4],withMode[2]].filter((v,i,a)=>a.indexOf(v)===i),m,
      `The mode is the value that appears MOST often: ${m}.`,
      `Mode = the number that shows up the most times.`);}
  const outlier=data[4]+rng(30,60);
  return mcq('Outliers','6.PS.2',`Data: ${data.join(', ')}. Now an outlier of ${outlier} is added.\nWhich measure changes the MOST?`,
    ['The mean','The median','The mode','The range stays the same'],'The mean',
    `Outliers pull the MEAN strongly because every value affects the average. The median barely moves.`,
    `Which measure uses EVERY value in its calculation?`);
};

// 6.NS.2 — Integers: represent, compare, order, absolute value

      [String(-a),String(a),'0',String(2*a)],String(-a),
      `Absolute value is the DISTANCE from zero, always positive. |${a}| = ${-a}.`,
      `Absolute value = how far the number is from 0 on a number line. Distance is never negative.`);}
  if(t===1){let a=rng(-15,15),b=rng(-15,15);while(a===b)b=rng(-15,15);
    return mcq('Compare Integers','6.NS.2',`Which symbol makes this true?   ${a} ___ ${b}`,
      ['<','>','='],a<b?'<':'>',
      `On a number line, ${a} is to the ${a<b?'LEFT':'RIGHT'} of ${b}, so ${a} ${a<b?'<':'>'} ${b}.`,
      `On a number line, numbers farther LEFT are smaller. Negatives are less than positives.`);}
  if(t===2){const nums=[-rng(1,9),rng(1,9),-rng(10,18),rng(10,18)];
    const sorted=[...nums].sort((x,y)=>x-y);

      [sorted.join(', '),[...sorted].reverse().join(', '),nums.join(', ')],sorted.join(', '),
      `Left-to-right on a number line: ${sorted.join(' < ')}.`,

  if(t===3){const ctx=pick([
      ['a debt of $%d','−%d',8,25],['%d degrees below zero','−%d',3,15],

    const v=rng(ctx[2],ctx[3]);

  if(t===1){const d=rng(4,24);
    return mcq('Diameter & Radius','6.MG.1',`A circle has a diameter of ${d} cm. What is its RADIUS?`,
      [`${d/2} cm`,`${d} cm`,`${2*d} cm`,`${d/2+1} cm`],`${d/2} cm`,

  if(t===3){const r=rng(2,10);const a=(3.14*r*r).toFixed(2);

      `Area = π × radius². Square the radius FIRST, then multiply by π.`);}
  const parts=[['chord','a segment whose endpoints are both on the circle'],

// FX ENGINE — Web Audio sounds + visual juice
// ═══════════════════════════════════════════════════════════════
const FX=(function(){
  let ctx=null, enabled=true;
  function ac(){ if(!ctx){ try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){enabled=false;} } return ctx; }
  function tone(freq,dur,type,vol,slideTo){
    if(!enabled)return; const c=ac(); if(!c)return;
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,c.currentTime+dur);
    g.gain.setValueAtTime((vol||0.2),c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
    o.connect(g);g.connect(c.destination);
    o.start();o.stop(c.currentTime+dur);
  }
  function noise(dur,vol){
    if(!enabled)return; const c=ac(); if(!c)return;
    const sr=c.sampleRate, buf=c.createBuffer(1,sr*dur,sr), d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
    const src=c.createBufferSource(), g=c.createGain();
    src.buffer=buf; g.gain.value=vol||0.15;
    g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
    src.connect(g);g.connect(c.destination);src.start();
  }
  return {
    toggle(){enabled=!enabled;return enabled;},
    isOn(){return enabled;},
    click(){tone(600,0.06,'square',0.12);},
    move(){tone(420,0.09,'sine',0.13);},
    correct(){tone(660,0.09,'sine',0.18);setTimeout(()=>tone(880,0.12,'sine',0.18),90);},
    wrong(){tone(200,0.22,'sawtooth',0.16,120);},
    coin(){tone(988,0.07,'square',0.15);setTimeout(()=>tone(1319,0.14,'square',0.15),70);},
    win(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.16,'sine',0.2),i*110));},
    lose(){[392,330,262].forEach((f,i)=>setTimeout(()=>tone(f,0.2,'sawtooth',0.16),i*130));},
    laser(){tone(880,0.14,'square',0.14,180);},
    explosion(){noise(0.32,0.2);tone(120,0.3,'sawtooth',0.14,50);},
    slice(){tone(1200,0.05,'sine',0.13,400);},
    powerup(){[440,554,659,880].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*55));},
    combo(n){tone(600+n*80,0.1,'square',0.15);},
    tick(){tone(800,0.03,'square',0.06);},
  };
})();

// ── Confetti ──
function confetti(x,y,count){
  const colors=['#F59E0B','#10B981','#3B82F6','#EC4899','#8B5CF6','#EF4444','#14B8A6'];
  const cont=document.createElement('div');
  cont.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:9998;overflow:hidden';
  document.body.appendChild(cont);
  for(let i=0;i<(count||40);i++){
    const p=document.createElement('div');
    const size=rng(6,12), color=pick(colors), ang=Math.random()*Math.PI*2, vel=rng(4,13);
    const vx=Math.cos(ang)*vel, vy=Math.sin(ang)*vel-rng(3,9);
    p.style.cssText=`position:absolute;left:${x}px;top:${y}px;width:${size}px;height:${size}px;background:${color};border-radius:${Math.random()>.5?'50%':'2px'};opacity:1`;
    cont.appendChild(p);
    let px=x,py=y,dvx=vx,dvy=vy,life=0;
    const anim=()=>{
      life++;dvy+=0.5;px+=dvx;py+=dvy;dvx*=0.98;
      p.style.transform=`translate(${px-x}px,${py-y}px) rotate(${life*18}deg)`;
      p.style.opacity=Math.max(0,1-life/55);
      if(life<55)requestAnimationFrame(anim); 
    };
    requestAnimationFrame(anim);
  }
  setTimeout(()=>cont.remove(),1100);
}
// ── Particle burst (small) ──
function burst(x,y,color,count){
  const cont=document.createElement('div');
  cont.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:9998';
  document.body.appendChild(cont);
  for(let i=0;i<(count||14);i++){
    const p=document.createElement('div');const size=rng(4,9);
    const ang=(Math.PI*2/count)*i+Math.random()*0.5, vel=rng(3,8);
    const vx=Math.cos(ang)*vel, vy=Math.sin(ang)*vel;
    p.style.cssText=`position:absolute;left:${x}px;top:${y}px;width:${size}px;height:${size}px;background:${color||'#F59E0B'};border-radius:50%`;
    cont.appendChild(p);
    let px=x,py=y,life=0;
    const anim=()=>{life++;px+=vx;py+=vy;p.style.transform=`translate(${px-x}px,${py-y}px)`;p.style.opacity=Math.max(0,1-life/28);if(life<28)requestAnimationFrame(anim);};
    requestAnimationFrame(anim);
  }
  setTimeout(()=>cont.remove(),700);
}
// ── Floating score text ──
function floatText(x,y,text,color){
  const el=document.createElement('div');
  el.textContent=text;
  el.style.cssText=`position:fixed;left:${x}px;top:${y}px;transform:translate(-50%,-50%);font-family:'Fredoka',cursive;font-size:1.6rem;color:${color||'#F59E0B'};text-shadow:0 2px 8px rgba(0,0,0,.3);pointer-events:none;z-index:9999;transition:all .9s cubic-bezier(.2,.8,.3,1);opacity:1`;
  document.body.appendChild(el);
  requestAnimationFrame(()=>{el.style.top=(y-70)+'px';el.style.opacity='0';el.style.fontSize='2.2rem';});
  setTimeout(()=>el.remove(),950);
}
// ── Screen shake ──
function shake(intensity){
  const el=document.getElementById('app');if(!el)return;
  const i=intensity||6;let n=0;
  const iv=setInterval(()=>{n++;el.style.transform=`translate(${rng(-i,i)}px,${rng(-i,i)}px)`;if(n>6){clearInterval(iv);el.style.transform='';}},28);
}
// ── Flash overlay ──
function flash(color){
  const el=document.createElement('div');
  el.style.cssText=`position:fixed;inset:0;background:${color||'#10B981'};opacity:.35;pointer-events:none;z-index:9997;transition:opacity .4s`;
  document.body.appendChild(el);
  requestAnimationFrame(()=>el.style.opacity='0');
  setTimeout(()=>el.remove(),420);
}

    if((m=t.match(/parallelogram has a base of (\d+) (cm|m) and a height of (\d+)/)))return {svg:dgParallelogram(+m[1],+m[3],m[2],col)};
    if((m=t.match(/trapezoid has bases of (\d+) cm and (\d+) cm, and a height of (\d+)/)))return {svg:dgTrapezoid(+m[1],+m[2],+m[3],'cm',col)};
    if((m=t.match(/(?:prism|box) is (\d+) × (\d+) × (\d+) cm/)))return {svg:dgPrism(+m[1],+m[2],+m[3],'cm',col)};
    if(/\((-?\d+), (-?\d+)\)/.test(t)&&/Point|point|Points/.test(t)){
      const pts=[...t.matchAll(/\((-?\d+), (-?\d+)\)/g)].slice(0,2).map((x,i)=>({x:+x[1],y:+x[2]}));
      const lab=(t.match(/Point ([A-Z])/)||[])[1];
      pts.forEach((p,i)=>p.label=lab||(pts.length>1?'PQ'[i]:'P')+` (${p.x}, ${p.y})`);
      if(lab)pts[0].label=`${lab} (${pts[0].x}, ${pts[0].y})`;
      if(pts.every(p=>Math.abs(p.x)<=7&&Math.abs(p.y)<=7))return {svg:dgGrid(pts,col)};}
    if((m=t.match(/SOLUTION to\s+x ([<>≤≥]) (\d+)/)))return {svg:dgIneq(m[1],+m[2],col)};
    if(/circle graph shows:/.test(t)){const pairs=[...t.matchAll(/([A-Z][a-z]+) (\d+)%/g)].map(x=>[x[1],+x[2]]);
      if(pairs.length>=3)return {svg:dgPie(pairs),text:t.replace(/A circle graph shows:[^.]*%\./,'Look at the circle graph.')};}
    if((m=t.match(/Data: ([\d, ]+)/))){const vals=m[1].split(',').map(s=>+s.trim()).filter(n=>!isNaN(n));
      const o=t.match(/outlier of (\d+)/);if(vals.length>=3)return {svg:dgDots(vals,col,o?+o[1]:undefined)};}
    if((m=t.match(/^What is (\d+)²\?/))&&+m[1]<=12)return {svg:dgSquareGrid(+m[1],col)};
    if((m=t.match(/temperature is (−?-?\d+)°F/)))return {svg:dgThermo(num(m[1]))};
  }catch(e){return null;}
  return null;
}

function fmtTime(sec){sec=Math.round(sec||0);if(sec<60)return sec+'s';const m=Math.floor(sec/60);
  if(m<60)return m+' min';return Math.floor(m/60)+'h '+(m%60)+'m';}

// ── grade content & skills ──
function gradeContent(){return ST.grade<=4?4:6;}
function skillsFor(subj){return STRANDS[gradeContent()][subj]||[];}
function allSkills(){const out=[];Object.keys(SUBJ).forEach(s=>skillsFor(s).forEach(st=>out.push({subj:s,st})));return out;}
function findSkill(subj,code){return skillsFor(subj).find(s=>s.code===code);}
function skillKey(subj,code){return gradeContent()+':'+subj+':'+code;}
function getSkill(subj,code){return ST.skills[skillKey(subj,code)]||null;}
function ensureSkill(subj,code){const k=skillKey(subj,code);
  return ST.skills[k]||(ST.skills[k]={score:0,n:0,c:0,sec:0,best:0,last:0,mastered:0});}
function scoreOf(subj,code){const s=getSkill(subj,code);return s?s.score:0;}
function level(score,n){
  if(!n)return {t:'Not started',cls:'lv0'};
  if(score>=100)return {t:'Mastered',cls:'lv4'};
  if(score>=90)return {t:'Challenge zone',cls:'lv3'};
  if(score>=80)return {t:'Proficient',cls:'lv2'};
  return {t:'Practicing',cls:'lv1'};
}
// SmartScore: big gains early, small gains near the top; mistakes cost more in the challenge zone.
function smartGain(s){return s<40?12:s<60?9:s<80?6:s<90?4:2;}
function smartLoss(s){return s<50?4:s<80?7:s<90?9:12;}
function ring(score,size,color,label){
  const done=score>=100;
  return `<div class="ring${done?' ring-done':''}" style="--p:${score};--c:${done?'#F59E0B':color};width:${size}px;height:${size}px;font-size:${Math.round(size*.3)}px">
    <span>${done?'🏅':(label!==undefined?label:score)}</span></div>`;
}

// ── daily activity ──
function dayRec(k){k=k||todayKey();return ST.days[k]||(ST.days[k]={q:0,c:0,sec:0});}
function todayQ(){const d=ST.days[todayKey()];return d?d.q:0;}
function dayStreak(){
  const d=new Date();let n=0;
  if(!(ST.days[todayKey(d)]&&ST.days[todayKey(d)].q))d.setDate(d.getDate()-1);
  while(ST.days[todayKey(d)]&&ST.days[todayKey(d)].q){n++;d.setDate(d.getDate()-1);}
  return n;
}
function totalMastered(){return allSkills().filter(x=>scoreOf(x.subj,x.st.code)>=100).length;}

        ${Object.keys(PROFILES.list).length?`<button class="link-btn" onclick="${p?'renderDash()':'renderWho()'}">Cancel</button>`:''}

function formAvatar(btn,a){_form.avatar=a;document.querySelectorAll('.av-btn').forEach(b=>b.classList.toggle('sel',b===btn));}
function formGrade(g){_form.grade=g;document.querySelectorAll('.g-btn').forEach(b=>b.classList.toggle('sel',+b.dataset.g===g));formCheck();}
function formCheck(){const b=document.getElementById('goBtn');if(b)b.disabled=!(_form.name&&_form.grade);}
function formSave(){
  if(!(_form.name&&_form.grade))return;
  if(_form.id){const p=PROFILES.list[_form.id];p.name=_form.name;p.grade=_form.grade;p.avatar=_form.avatar;
    if(ST.id===_form.id){ST.name=p.name;ST.grade=p.grade;ST.avatar=p.avatar;save();}else persistProfiles();
    return renderDash();}
  const p=blankLearner(_form.name,_form.grade,_form.avatar);PROFILES.list[p.id]=p;persistProfiles();
  activateProfile(p.id);renderDash();
}

function recommended(n){
  const all=allSkills();const out=[];const seen=new Set();
  const add=x=>{const k=x.subj+'|'+x.st.code;if(!seen.has(k)&&out.length<n){seen.add(k);out.push(x);}};
  if(ST.lastSkill){const x=all.find(a=>a.subj===ST.lastSkill.subj&&a.st.code===ST.lastSkill.code);
    if(x&&scoreOf(x.subj,x.st.code)<100)add(x);}
  all.filter(x=>{const s=getSkill(x.subj,x.st.code);return s&&s.n&&s.score<80;})
     .sort((a,b)=>scoreOf(a.subj,a.st.code)-scoreOf(b.subj,b.st.code)).forEach(add);
  // then the first untouched skill in each subject, round-robin
  const fresh=Object.keys(SUBJ).map(s=>skillsFor(s).filter(st=>!getSkill(s,st.code)||!getSkill(s,st.code).n).map(st=>({subj:s,st})));
  for(let i=0;out.length<n&&i<20;i++)fresh.forEach(f=>{if(f[i])add(f[i]);});
  all.filter(x=>scoreOf(x.subj,x.st.code)<100).forEach(add);
  return out;
}

// ═══════════════ SKILL MAP ═══════════════
let _filter='all';
function familyOf(code){const m=code.match(/^\d\.([A-Z]+)\./);if(m)return m[1];return G4_FAMILY[code]||null;}
function openSubject(subj,filter){
  ST.subject=subj;if(filter)_filter=filter;const s=SUBJ[subj];const gc=gradeContent();
  const sk=skillsFor(subj);
  const keep=st=>{const r=getSkill(subj,st.code);const n=r?r.n:0,sc=r?r.score:0;
    return _filter==='all'||(_filter==='todo'&&!n)||(_filter==='doing'&&n&&sc<100)||(_filter==='done'&&sc>=100);};
  const row=st=>{const r=getSkill(subj,st.code);const n=r?r.n:0,sc=r?r.score:0;const lv=level(sc,n);
    return `<div class="skill">
      <button class="skill-main" onclick="startSkill('${subj}','${st.code}')">
        ${ring(sc,52,s.color)}
        <span class="skill-info"><span class="skill-code" style="background:${s.lt};color:${s.dk}">SOL ${st.code}</span>
        <span class="skill-name">${st.name}</span><span class="skill-desc">${st.desc}</span></span>
        <span class="lv ${lv.cls}">${lv.t}</span></button>
      <button class="skill-learn" onclick="openLesson('${subj}','${st.code}')" title="Learn it first" aria-label="Lesson for ${esc(st.name)}">${ic('lesson')}</button>
    </div>`;};
  let body='';
  if(subj==='math'){
    const groups={};sk.filter(keep).forEach(st=>{const f=familyOf(st.code)||'other';(groups[f]=groups[f]||[]).push(st);});
    body=Object.keys(FAMILY).filter(f=>groups[f]).map(f=>`<div class="fam"><div class="fam-h"><span class="fam-code" style="background:${s.color}">${gc}.${f}</span>${FAMILY[f]}</div>${groups[f].map(row).join('')}</div>`).join('');
  } else body=sk.filter(keep).map(row).join('');
  const counts={all:sk.length,todo:sk.filter(st=>!(getSkill(subj,st.code)||{}).n).length,
    doing:sk.filter(st=>{const r=getSkill(subj,st.code);return r&&r.n&&r.score<100;}).length,
    done:sk.filter(st=>scoreOf(subj,st.code)>=100).length};
  setScreen(`<div id="strands" class="screen active">
    <div class="topbar" style="background:${s.band}">
      <button class="tb-back" onclick="renderDash()" aria-label="Back">←</button>
      <div class="tb-user"><div class="tb-name" style="color:#fff">${s.label}</div>
      <div class="tb-sub" style="color:rgba(255,255,255,.9)">Grade ${gc} · ${counts.done} of ${counts.all} skills mastered</div></div>
      <div class="tb-art">${subjArt(subj,96)}</div>
    </div>
    <div class="strand-body">
      <div class="chips">${[['all','All'],['todo','Not started'],['doing','In progress'],['done','Mastered']].map(([k,l])=>
        `<button class="chip${_filter===k?' on':''}" style="${_filter===k?`background:${s.color};border-color:${s.color}`:''}" onclick="openSubject('${subj}','${k}')">${l} <b>${counts[k]}</b></button>`).join('')}</div>
      ${body||`<div class="empty">Nothing here yet. Try another filter.</div>`}
      <p class="muted" style="margin-top:14px">Tap a skill to practice. 📘 opens a quick lesson. Questions are made fresh every time, so practice as long as you like.</p>
    </div></div>`);
}

  const r=getSkill(subj,code);
  if(!r||!r.n)return openLesson(subj,code,true);
  beginPractice(subj,code);
}

  drawExample(subj,code);narrLoad(lessonSprite(st.gen));
