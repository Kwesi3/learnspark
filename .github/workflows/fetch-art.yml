name: Fetch illustrations
on:
  workflow_dispatch:
    inputs:
      list:
        description: "name=url pairs, one per line (base64)"
        required: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and convert
        run: |
          sudo apt-get -qq install -y webp >/dev/null
          mkdir -p assets/art
          echo "${{ inputs.list }}" | base64 -d > /tmp/list.txt
          while IFS='=' read -r name url; do
            [ -z "$name" ] && continue
            echo "::add-mask::$url"
            curl -sSfL -o "/tmp/$name.png" "$url"
            cwebp -quiet -q 78 "/tmp/$name.png" -o "assets/art/$name.webp"
            echo "saved $name"
          done < /tmp/list.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/art
          git commit -m "Add illustrations" || echo "nothing new"
          git push
